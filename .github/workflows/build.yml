name: Build Kernel Redmi 12C (earth) - 4.19.325 + CIP 4.19.y

on:
  workflow_dispatch:
    inputs:
      cip_tag:
        description: 'Target CIP tag (blank = latest, e.g. v4.19.325-cip136)'
        required: false
        default: ''
      st_suffix:
        description: 'Override localversion-st (blank = value from CIP tag, e.g. -st13)'
        required: false
        default: ''
  push:
    branches: [main, master]
  schedule:
    - cron: '0 3 * * 1' # every Monday 03:00 UTC

concurrency:
  group: earth-kernel-build
  cancel-in-progress: true

permissions:
  contents: write

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_xiaomi_earth.git
  KERNEL_BRANCH: lineage-23.2
  DEFCONFIG: earth_defconfig
  AK3_REPO: https://github.com/osm0sis/AnyKernel3.git
  CIP_REPO: https://gitlab.com/cip-project/cip-kernel/linux-cip.git
  BASE_REPO: https://github.com/gregkh/linux.git
  BASE_TAG: v4.19.325
  LLVM_DIR: /usr/lib/llvm-17/bin
  CROSS_COMPILE: aarch64-linux-gnu-
  LOG_FILE: ${{ github.workspace }}/build-log.txt

jobs:
  build:
    name: Build earth (4.19.325 + CIP)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout this workflow repo
        uses: actions/checkout@v4

      - name: Install toolchain and build dependencies
        run: |
          set -euo pipefail
          : > "$LOG_FILE"
          {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              clang-17 lld-17 llvm-17 \
              gcc-aarch64-linux-gnu \
              bc flex bison libssl-dev libelf-dev \
              xz-utils curl zip unzip patch python3
            "${LLVM_DIR}/clang" --version | head -1
            "${CROSS_COMPILE}gcc" --version | head -1
          } 2>&1 | tee -a "$LOG_FILE"

      - name: Clone LineageOS kernel source (direct, no fork)
        run: |
          set -euo pipefail
          {
            git clone --depth 1 --branch "${KERNEL_BRANCH}" "${KERNEL_REPO}" kernel
            echo "Kernel source:"
            grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' kernel/Makefile
            echo "Current localversion files in source:"
            for f in kernel/localversion*; do
              [[ -f "$f" ]] && echo "$(basename "$f"): $(cat "$f")"
            done
            echo "Source commit: $(git -C kernel rev-parse HEAD)"
          } 2>&1 | tee -a "$LOG_FILE"

      - name: Merge CIP 4.19.y patches into LineageOS tree
        id: cip
        working-directory: kernel
        env:
          CIP_TAG_INPUT: ${{ inputs.cip_tag }}
          ST_SUFFIX_INPUT: ${{ inputs.st_suffix }}
        run: |
          set -euo pipefail

          # Determine target tag. Blank input -> newest v4.19.325-cipN tag on GitLab.
          if [[ -n "${CIP_TAG_INPUT:-}" ]]; then
            TARGET="${CIP_TAG_INPUT}"
          else
            TARGET="$(curl -fsSL "https://gitlab.com/api/v4/projects/cip-project%2Fcip-kernel%2Flinux-cip/repository/tags?search=v4.19.325-cip&per_page=100" \
              | python3 -c '
          import json, re, sys
          tags = json.load(sys.stdin)
          found = []
          for t in tags:
              m = re.fullmatch(r"v4\.19\.325-cip(\d+)", t["name"])
              if m:
                  found.append((int(m.group(1)), t["name"]))
          if not found:
              sys.exit("No v4.19.325-cipN tag found")
          print(max(found)[1])
          ')"
          fi
          echo "CIP target tag: ${TARGET}" | tee -a "$LOG_FILE"

          # Start from the CIP level already present in the vendor tree, not from
          # vanilla 4.19.325. This avoids thousands of "already applied" hunks.
          CURRENT_SUFFIX="$(cat localversion-cip 2>/dev/null || true)"
          if [[ "${CURRENT_SUFFIX}" =~ ^-cip([0-9]+)$ ]]; then
            SOURCE_TAG="v4.19.325-cip${BASH_REMATCH[1]}"
            SOURCE_REPO="${CIP_REPO}"
          else
            SOURCE_TAG="${BASE_TAG}"
            SOURCE_REPO="${BASE_REPO}"
          fi
          echo "CIP source level: ${SOURCE_TAG} (localversion '${CURRENT_SUFFIX:-none}')" \
            | tee -a "$LOG_FILE"

          {
            git fetch --no-tags --depth=1 "${SOURCE_REPO}" \
              "refs/tags/${SOURCE_TAG}:refs/tags/cip-source"
            git fetch --no-tags --depth=1 "${CIP_REPO}" \
              "refs/tags/${TARGET}:refs/tags/cip-target"

            # Only the patches added after the source's current CIP level.
            git diff --full-index cip-source cip-target > /tmp/cip.patch
            echo "Incremental CIP patch (${SOURCE_TAG} -> ${TARGET}): $(du -h /tmp/cip.patch | cut -f1)"
          } 2>&1 | tee -a "$LOG_FILE"

          if [[ ! -s /tmp/cip.patch ]]; then
            echo "::notice::Already at ${TARGET}; no CIP patches to apply."
          else
            # Apply per file. One bad file (e.g. a path missing from the vendor
            # tree) must not abort the whole merge. Clean chunks are merged
            # 3-way; conflicting chunks are reverted and recorded, then the
            # build continues so we still get a usable kernel.
            rm -rf /tmp/cip-chunks
            python3 - <<'PY'
          from pathlib import Path
          src = Path('/tmp/cip.patch').read_text(errors='replace').splitlines(keepends=True)
          out = Path('/tmp/cip-chunks')
          out.mkdir(parents=True, exist_ok=True)
          paths, cur = [], None
          for line in src:
              if line.startswith('diff --git '):
                  if cur is not None:
                      (out / f'{len(paths)-1:04d}.patch').write_text(''.join(cur))
                  parts = line.split()
                  raw = parts[2] if len(parts) > 2 else parts[1]
                  paths.append(raw[2:] if raw.startswith('a/') else raw)
                  cur = [line]
              elif cur is not None:
                  cur.append(line)
          if cur is not None:
              (out / f'{len(paths)-1:04d}.patch').write_text(''.join(cur))
          with (out / 'manifest.tsv').open('w') as f:
              for i, p in enumerate(paths):
                  f.write(f'{i:04d}\t{p}\n')
          print(f'CIP patch split into {len(paths)} file chunks')
          PY

            SKIPPED_FILE="$GITHUB_WORKSPACE/cip-skipped.txt"
            : > "$SKIPPED_FILE"
            APPLIED=0
            while IFS=$'\t' read -r idx path; do
              if git apply --3way --whitespace=nowarn "/tmp/cip-chunks/${idx}.patch" \
                  >/dev/null 2>&1; then
                APPLIED=$((APPLIED + 1))
                echo "APPLIED  ${path}" >> "$LOG_FILE"
              else
                # Undo any partial 3-way state for just this file.
                git reset -q HEAD -- "${path}" 2>/dev/null || true
                git checkout -q -f HEAD -- "${path}" 2>/dev/null \
                  || git clean -q -f -- "${path}" 2>/dev/null || true
                echo "${path}" >> "$SKIPPED_FILE"
                echo "SKIPPED  ${path}" | tee -a "$LOG_FILE"
              fi
            done < /tmp/cip-chunks/manifest.tsv

            SKIPPED="$(wc -l < "$SKIPPED_FILE" | tr -d ' ')"
            {
              echo "CIP chunks applied: ${APPLIED}"
              echo "CIP chunks skipped (conflict with vendor tree): ${SKIPPED}"
              if [[ "${SKIPPED}" -gt 0 ]]; then
                echo "::warning::${SKIPPED} CIP files could not be auto-merged and were skipped."
                echo "Skipped files:"
                cat "$SKIPPED_FILE"
              fi
            } 2>&1 | tee -a "$LOG_FILE"

            if [[ "${APPLIED}" -eq 0 ]]; then
              echo "::error::No CIP chunk could be applied." | tee -a "$LOG_FILE"
              exit 1
            fi
          fi

          CIP_NUM="${TARGET##*-cip}"
          CIP_SUFFIX="-cip${CIP_NUM}"
          ST_SUFFIX="${ST_SUFFIX_INPUT:-}"
          if [[ -z "${ST_SUFFIX}" ]]; then
            ST_SUFFIX="$(git show cip-target:localversion-st 2>/dev/null || true)"
          fi

          # kbuild appends all localversion* files to the release string.
          printf '%s\n' "${CIP_SUFFIX}" > localversion-cip
          if [[ -n "${ST_SUFFIX}" ]]; then
            printf '%s\n' "${ST_SUFFIX}" > localversion-st
          fi

          echo "Target CIP  : ${TARGET}"
          echo "Version bits: ${CIP_SUFFIX} ${ST_SUFFIX}"
          {
            echo "source=${SOURCE_TAG}"
            echo "target=${TARGET}"
            echo "cip_suffix=${CIP_SUFFIX}"
            echo "st_suffix=${ST_SUFFIX}"
          } >> "$GITHUB_OUTPUT"

      - name: Normalize vendor/CIP API mismatches
        run: |
          set -euo pipefail
          cd kernel
          FIXES="$GITHUB_WORKSPACE/cip-fixes.txt"
          export FIXES
          : > "$FIXES"

          # A per-file 3-way merge can leave a CIP header next to a vendor
          # implementation (or vice versa). Fix the known API mismatches that
          # otherwise break compilation before `make` starts.
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          fixes = Path(os.environ["FIXES"])
          changed = []

          # CIP changed to_ratio() to return u64. Keep declaration and
          # definition consistent whichever side of the merge landed.
          sched_h = Path("kernel/sched/sched.h")
          sched_c = Path("kernel/sched/core.c")
          if sched_h.exists() and sched_c.exists():
              h = sched_h.read_text(errors="replace")
              c = sched_c.read_text(errors="replace")
              if re.search(r"\bu64\s+to_ratio\s*\(", h):
                  new, n = re.subn(
                      r"\bunsigned\s+long\s+to_ratio\s*\(", "u64 to_ratio(", c)
                  if n:
                      sched_c.write_text(new)
                      changed.append(
                          f"to_ratio: {n} definition(s) in kernel/sched/core.c aligned to u64")
              elif re.search(r"\bunsigned\s+long\s+to_ratio\s*\(", h):
                  new, n = re.subn(
                      r"\bu64\s+to_ratio\s*\(", "unsigned long to_ratio(", c)
                  if n:
                      sched_c.write_text(new)
                      changed.append(
                          f"to_ratio: {n} definition(s) aligned to unsigned long")

          # CIP replaced f2fs_msg() with f2fs_err()/f2fs_warn()/... macros.
          # Convert surviving vendor call sites when the new header landed.
          f2fs_h = Path("fs/f2fs/f2fs.h")
          if f2fs_h.exists():
              h = f2fs_h.read_text(errors="replace")
              if "#define f2fs_err(" in h and "#define f2fs_msg(" not in h:
                  levels = {
                      "KERN_ERR": "f2fs_err",
                      "KERN_CRIT": "f2fs_err",
                      "KERN_ALERT": "f2fs_err",
                      "KERN_EMERG": "f2fs_err",
                      "KERN_WARNING": "f2fs_warn",
                      "KERN_NOTICE": "f2fs_notice",
                      "KERN_INFO": "f2fs_info",
                      "KERN_DEBUG": "f2fs_debug",
                  }
                  pat = re.compile(
                      r"f2fs_msg\(\s*([^,]+?)\s*,\s*(KERN_[A-Z]+)\s*,")

                  def repl(m):
                      arg = m.group(1).strip()
                      for suffix in ("->sb", ".sb"):
                          if arg.endswith(suffix):
                              arg = arg[:-len(suffix)]
                              break
                      macro = levels.get(m.group(2), "f2fs_err")
                      return f"{macro}({arg},"

                  for p in sorted(Path("fs/f2fs").rglob("*.[ch]")):
                      txt = p.read_text(errors="replace")
                      new, n = pat.subn(repl, txt)
                      if n:
                          p.write_text(new)
                          changed.append(
                              f"f2fs logging: {n} f2fs_msg() call(s) in {p}")

          if changed:
              fixes.write_text("\n".join(changed) + "\n")
              print("\n".join(changed))
          else:
              print("No vendor/CIP API normalization needed")
          PY

          if [[ -s "$FIXES" ]]; then
            {
              echo "=== Applied vendor/CIP API compatibility fixes ==="
              cat "$FIXES"
            } 2>&1 | tee -a "$LOG_FILE"
          fi

      - name: Build kernel
        id: build
        run: |
          set -euo pipefail
          cd kernel

          MAKE_ARGS=(
            -j"$(nproc)"
            O=../out
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CC="${LLVM_DIR}/clang"
            LD="${LLVM_DIR}/ld.lld"
            AR="${LLVM_DIR}/llvm-ar"
            NM="${LLVM_DIR}/llvm-nm"
            OBJCOPY="${LLVM_DIR}/llvm-objcopy"
            OBJDUMP="${LLVM_DIR}/llvm-objdump"
            READELF="${LLVM_DIR}/llvm-readelf"
            STRIP="${LLVM_DIR}/llvm-strip"
            CROSS_COMPILE="${CROSS_COMPILE}"
          )

          {
            echo "=== make ${DEFCONFIG} ==="
            make "${MAKE_ARGS[@]}" "${DEFCONFIG}"
            echo "=== make Image.gz-dtb ==="
            make "${MAKE_ARGS[@]}" Image.gz-dtb
            ls -lh ../out/arch/arm64/boot/Image.gz-dtb
          } 2>&1 | tee -a "$LOG_FILE"

          BASE_VER="$(awk '/^VERSION/ {v=$3} /^PATCHLEVEL/ {p=$3} /^SUBLEVEL/ {s=$3} END {print v"."p"."s}' Makefile)"
          LV="$(grep '^CONFIG_LOCALVERSION=' ../out/.config | head -1 | cut -d= -f2- | tr -d '\"')"
          CIP_LV="$(cat localversion-cip 2>/dev/null || true)"
          ST_LV="$(cat localversion-st 2>/dev/null || true)"
          FULL_REL="${BASE_VER}${LV}${CIP_LV}${ST_LV}"
          echo "kernel_version=${FULL_REL}" >> "$GITHUB_OUTPUT"
          echo "uname -r will be: ${FULL_REL}-g<sha>"

      - name: Package flashable AnyKernel3 zip
        id: package
        run: |
          set -euo pipefail

          KVER="${{ steps.build.outputs.kernel_version }}"
          SHORT_SHA="$(git -C kernel rev-parse --short HEAD)"
          DATE="$(date +%Y%m%d)"
          ZIP_NAME="kernel-earth-${KVER}-${DATE}-${SHORT_SHA}.zip"

          git clone --depth 1 "${AK3_REPO}" anykernel
          rm -rf anykernel/.git
          cp out/arch/arm64/boot/Image.gz-dtb anykernel/Image.gz-dtb

          cat > anykernel/anykernel.sh <<'AK3EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          properties() { '
          kernel.string=Earth Kernel
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=earth
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          '; }

          ### AnyKernel install
          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          AK3EOF

          sed -i "s|^kernel.string=.*|kernel.string=Earth ${KVER} (LineageOS 23.2 / CIP 4.19.y) - ${SHORT_SHA}|" anykernel/anykernel.sh

          (
            cd anykernel
            zip -r9 "../${ZIP_NAME}" . -x '*.md'
          )

          unzip -t "${ZIP_NAME}" >/dev/null
          echo "zip=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "kver=${KVER}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "${ZIP_NAME}" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-earth-${{ steps.package.outputs.kver }}-${{ steps.package.outputs.sha }}
          path: |
            ${{ steps.package.outputs.zip }}
            out/arch/arm64/boot/Image.gz-dtb
            out/.config
          if-no-files-found: error
          retention-days: 14

      - name: Generate release notes and job summary
        id: notes
        run: |
          set -e
          SKIPPED=0
          if [[ -f "$GITHUB_WORKSPACE/cip-skipped.txt" ]]; then
            SKIPPED="$(wc -l < "$GITHUB_WORKSPACE/cip-skipped.txt" | tr -d ' ')"
          fi
          FIXED=0
          if [[ -f "$GITHUB_WORKSPACE/cip-fixes.txt" ]]; then
            FIXED="$(wc -l < "$GITHUB_WORKSPACE/cip-fixes.txt" | tr -d ' ')"
          fi
          cat > release_notes.md <<EOF
          ## Kernel Redmi 12C / POCO C55 (earth) — CIP 4.19.y

          - **Release:** \`${{ steps.package.outputs.kver }}\`
          - **Base:** LineageOS \`lineage-23.2\` (commit \`${{ steps.package.outputs.sha }}\`)
          - **CIP merge:** \`${{ steps.cip.outputs.source }}\` → \`${{ steps.cip.outputs.target }}\`
            (localversion: \`${{ steps.cip.outputs.cip_suffix }}\` \`${{ steps.cip.outputs.st_suffix }}\`)
          - **CIP files skipped (vendor conflicts):** ${SKIPPED}
          - **Vendor/CIP API compatibility fixes:** ${FIXED}
          - **Defconfig:** \`${DEFCONFIG}\`
          - **Toolchain:** Clang 17 + LLD, CROSS_COMPILE=\`${CROSS_COMPILE}\`
          - **Zip:** \`${{ steps.package.outputs.zip }}\` (${{ steps.package.outputs.size }})

          ### Flash
          1. Boot into LineageOS Recovery (or TWRP/OrangeFox).
          2. Apply Update / Install → sideload or select the zip.
          3. Wipe cache/dalvik if needed, then reboot.

          > Patches are taken directly from CIP GitLab. No fork is created.
          > Files that conflict with the vendor tree are skipped and listed below.
          EOF

          if [[ "${SKIPPED}" -gt 0 ]]; then
            {
              echo
              echo "### Skipped CIP files (vendor conflicts)"
              sed 's/^/- /' "$GITHUB_WORKSPACE/cip-skipped.txt"
            } >> release_notes.md
          fi
          if [[ "${FIXED}" -gt 0 ]]; then
            {
              echo
              echo "### Vendor/CIP API compatibility fixes"
              sed 's/^/- /' "$GITHUB_WORKSPACE/cip-fixes.txt"
            } >> release_notes.md
          fi

          cat release_notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.kver }}-${{ steps.package.outputs.date }}-${{ steps.package.outputs.sha }}
          name: Earth Kernel ${{ steps.package.outputs.kver }} (${{ steps.package.outputs.date }})
          body_path: release_notes.md
          files: ${{ steps.package.outputs.zip }}
          make_latest: true
          fail_on_unmatched_files: true

      - name: Collect failure log
        if: failure()
        run: |
          set +e
          OUT="$GITHUB_WORKSPACE/log.txt"
          {
            echo "=== Run info ==="
            echo "repo : ${GITHUB_REPOSITORY}"
            echo "run  : ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            echo "event: ${GITHUB_EVENT_NAME}  ref: ${GITHUB_REF}"
            echo "time : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "=== Captured build / patch log ==="
            if [[ -f "$LOG_FILE" ]]; then
              cat "$LOG_FILE"
            else
              echo "(no captured log yet)"
            fi
            echo
            echo "=== CIP files skipped (vendor conflicts) ==="
            if [[ -f "$GITHUB_WORKSPACE/cip-skipped.txt" ]]; then
              cat "$GITHUB_WORKSPACE/cip-skipped.txt"
            else
              echo "(none)"
            fi
            echo
            echo "=== Vendor/CIP API compatibility fixes ==="
            if [[ -f "$GITHUB_WORKSPACE/cip-fixes.txt" ]]; then
              cat "$GITHUB_WORKSPACE/cip-fixes.txt"
            else
              echo "(none)"
            fi
            echo
            echo "=== Kernel tree status (first 100) ==="
            git -C "$GITHUB_WORKSPACE/kernel" status --short 2>/dev/null | head -100
            echo
            echo "=== Workspace layout / disk ==="
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type d 2>/dev/null | head -40
            df -h "$GITHUB_WORKSPACE"
          } > "$OUT" 2>&1
          echo "log.txt: $(wc -l < "$OUT") lines, $(du -h "$OUT" | cut -f1)"
          echo "=== tail of log.txt for quick triage ==="
          tail -80 "$OUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure log (log.txt)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: earth-failure-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: log.txt
          if-no-files-found: warn
          retention-days: 30
