# Evernight Kernel — Workflow A: Merge & Source Validation
# REMOTE-FIRST: all source acquisition, merge, conflict handling, and validation run
# on GitHub-hosted runners. Local OpenCode never clones/builds/merges the kernel.
# Target: Xiaomi Redmi 12C (earth), MT6768, ARM64, Android 16 / LineageOS 23.2.
#
# Verified read-only (not invented):
#   base   : https://github.com/LineageOS/android_kernel_xiaomi_earth  branch lineage-23.2
#   original: Linux 4.19.325-cip124-st8  (Makefile 4.19.325 + localversion-cip=-cip124 + localversion-st=-st8)
#   CIP    : https://git.kernel.org/pub/scm/linux/kernel/git/cip/linux-cip.git  (official CIP source)
#   target : cip137-st21 requested; upstream tag v4.19.325-cip137-st21 does NOT exist.
#            verified compatible: v4.19-st21 (commit a6bb562ae602cbc05a5080e4bec0eaa601e3787f,
#            Linux 4.19.325, localversion-st=-st21; tree matches v4.19.325-cip137
#            commit 1bb512106982a56a0eb71afb604bb3afa03d1d46) + set localversion-cip=-cip137
#            -> effective 4.19.325-cip137-st21. Nothing fabricated.
name: kernel-merge

on:
  workflow_dispatch:
    inputs:
      base_repo:
        description: 'Base kernel repository URL'
        required: false
        default: 'https://github.com/LineageOS/android_kernel_xiaomi_earth'
      base_branch:
        description: 'Base branch'
        required: false
        default: 'lineage-23.2'
      upstream_repo:
        description: 'CIP upstream git URL (official, verified; not guessed)'
        required: false
        default: 'https://git.kernel.org/pub/scm/linux/kernel/git/cip/linux-cip.git'
      upstream_tag:
        description: 'CIP upstream tag to integrate (verified compatible)'
        required: false
        default: 'v4.19-st21'
      upgrade_branch:
        description: 'Dedicated upgrade branch'
        required: false
        default: 'kernel-upgrade/cip137-st21'
      original_version:
        description: 'Original kernel version string for baseline verification'
        required: false
        default: '4.19.325-cip124-st8'
      original_cip:
        description: 'Original CIP localversion'
        required: false
        default: '-cip124'
      original_st:
        description: 'Original ST localversion'
        required: false
        default: '-st8'
      target_cip:
        description: 'Target CIP localversion'
        required: false
        default: '-cip137'
      target_st:
        description: 'Target ST localversion'
        required: false
        default: '-st21'
      target_kernel_version:
        description: 'Expected upstream kernel version'
        required: false
        default: '4.19.325'
      mode:
        description: 'single = one merge of upstream tag; incremental = ordered intermediate ST tags'
        required: false
        default: 'single'
        type: choice
        choices:
          - single
          - incremental

# Minimal permissions. No secrets are hardcoded. Auto-provided GITHUB_TOKEN used only server-side.
permissions:
  contents: write   # push upgrade branch; nothing else

concurrency:
  group: kernel-merge-${{ inputs.upgrade_branch || 'kernel-upgrade/cip137-st21' }}
  cancel-in-progress: false

env:
  MERGE_DIAG_DIR: ${{ github.workspace }}/merge-diagnostics
  UPGRADE_BRANCH: ${{ inputs.upgrade_branch || 'kernel-upgrade/cip137-st21' }}

jobs:
  merge:
    name: CIP verification + incremental merge + source validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      upstream_commit: ${{ steps.verify_upstream.outputs.upstream_commit }}
      original_commit: ${{ steps.baseline.outputs.original_commit }}
      merge_base: ${{ steps.range.outputs.merge_base }}
      integrated_commits: ${{ steps.range.outputs.integrated_commits }}
      resolved_conflicts: ${{ steps.merge.outputs.resolved_conflicts }}
      upgrade_branch: ${{ env.UPGRADE_BRANCH }}
      effective_version: ${{ steps.finalize.outputs.effective_version }}
    steps:
      - name: Resource snapshot (runner memory/disk)
        run: |
          echo "nproc=$(nproc)"; free -m; df -h / | tail -n 1
          mkdir -p "$MERGE_DIAG_DIR"

      - name: Install minimal tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git ca-certificates jq

      # ---- Phase 1: source acquisition (shallow, single-branch, no extra tags/history) ----
      - name: Clone base repository (shallow, single-branch)
        run: |
          set -euo pipefail
          git clone --no-tags --single-branch --depth 1 \
            --branch "${{ inputs.base_branch || 'lineage-23.2' }}" \
            "${{ inputs.base_repo || 'https://github.com/LineageOS/android_kernel_xiaomi_earth' }}" \
            "$GITHUB_WORKSPACE/src"
          cd "$GITHUB_WORKSPACE/src"
          git remote -v

      # ---- Verify original CIP124-st8 baseline (record; warn, never fabricate) ----
      - name: Verify original CIP124-st8 baseline
        id: baseline
        working-directory: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          ORIG=$(git rev-parse HEAD)
          echo "original_commit=$ORIG" >> "$GITHUB_OUTPUT"
          echo "original_commit=$ORIG"
          echo "== kernel version =="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' Makefile
          KVER=$(awk '/^VERSION =/{v=$3}/^PATCHLEVEL =/{p=$3}/^SUBLEVEL =/{s=$3}END{print v"."p"."s}' Makefile)
          echo "kernel_version=$KVER"
          echo "== localversion files =="
          echo -n "localversion-cip: "; cat localversion-cip 2>/dev/null || echo "(absent)"
          echo -n "localversion-st : "; cat localversion-st 2>/dev/null || echo "(absent)"
          echo -n "CONFIG_LOCALVERSION: "; grep -E '^CONFIG_LOCALVERSION=' arch/arm64/configs/earth_defconfig 2>/dev/null || echo "(unset)"
          CIP=$(tr -d '[:space:]' < localversion-cip 2>/dev/null || echo '')
          ST=$(tr -d '[:space:]' < localversion-st 2>/dev/null || echo '')
          EXPECTED="${{ inputs.original_version || '4.19.325-cip124-st8' }}"
          {
            echo "original_commit=$ORIG"
            echo "kernel_version=$KVER"
            echo "localversion_cip=$CIP"
            echo "localversion_st=$ST"
            echo "expected_original=$EXPECTED"
          } > "$MERGE_DIAG_DIR/baseline.txt"
          [ "$CIP" = "${{ inputs.original_cip || '-cip124' }}" ] || echo "::warning::localversion-cip '$CIP' != '${{ inputs.original_cip || '-cip124' }}'"
          [ "$ST" = "${{ inputs.original_st || '-st8' }}" ] || echo "::warning::localversion-st '$ST' != '${{ inputs.original_st || '-st8' }}'"
          test -f arch/arm64/configs/earth_defconfig || echo "::warning::earth_defconfig not found at expected path"

      # ---- Phase 2: CIP upstream verification (remote metadata; nothing guessed) ----
      - name: Verify CIP upstream remote and target revision
        id: verify_upstream
        working-directory: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          UP="${{ inputs.upstream_repo || 'https://git.kernel.org/pub/scm/linux/kernel/git/cip/linux-cip.git' }}"
          TAG="${{ inputs.upstream_tag || 'v4.19-st21' }}"
          echo "upstream=$UP tag=$TAG"
          REFS=$(git ls-remote --tags "$UP" "$TAG" "refs/tags/$TAG^{}")
          echo "$REFS"
          [ -n "$REFS" ] || { echo "::error::upstream tag $TAG not found in $UP"; echo "$TAG" > "$MERGE_DIAG_DIR/failed-commits.txt"; exit 1; }
          COMMIT=$(printf '%s\n' "$REFS" | awk -v t="refs/tags/$TAG^{}" '$2==t{print $1}')
          [ -n "$COMMIT" ] || COMMIT=$(printf '%s\n' "$REFS" | awk -v t="refs/tags/$TAG" '$2==t{print $1}')
          [ -n "$COMMIT" ] || { echo "::error::could not resolve commit for $TAG"; exit 1; }
          echo "upstream_commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=$COMMIT"
          {
            echo "upstream_repo=$UP"
            echo "upstream_tag=$TAG"
            echo "upstream_commit=$COMMIT"
          } > "$MERGE_DIAG_DIR/upstream.txt"
          # fetch only necessary history for this tag; deepened later for merge-base
          git remote add cip "$UP" 2>/dev/null || git remote set-url cip "$UP"
          git fetch --no-tags --depth 1 cip "refs/tags/$TAG"
          UPSTREAM_REF=$(git rev-parse FETCH_HEAD)
          echo "fetched=$UPSTREAM_REF"
          [ "$UPSTREAM_REF" = "$COMMIT" ] || { echo "::error::fetched $UPSTREAM_REF != resolved $COMMIT"; exit 1; }
          KVER=$(git show "$UPSTREAM_REF:Makefile" | awk '/^VERSION =/{v=$3}/^PATCHLEVEL =/{p=$3}/^SUBLEVEL =/{s=$3}END{print v"."p"."s}')
          echo "upstream_kernel_version=$KVER"
          echo "upstream_kernel_version=$KVER" >> "$MERGE_DIAG_DIR/upstream.txt"
          EXPKV="${{ inputs.target_kernel_version || '4.19.325' }}"
          [ "$KVER" = "$EXPKV" ] || { echo "::error::upstream kernel $KVER != expected $EXPKV"; exit 1; }
          echo -n "upstream localversion-st: "; git show "$UPSTREAM_REF:localversion-st" 2>/dev/null || echo "(absent)"
          echo -n "upstream localversion-cip: "; git show "$UPSTREAM_REF:localversion-cip" 2>/dev/null || echo "(absent)"

      # ---- Determine actual commit range; merge-base via incremental deepening ----
      - name: Determine commit range and merge-base
        id: range
        working-directory: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          TAG="${{ inputs.upstream_tag || 'v4.19-st21' }}"
          BASE_BRANCH="${{ inputs.base_branch || 'lineage-23.2' }}"
          UP=$(git rev-parse FETCH_HEAD)
          MB=""
          for depth in 50 200 800 3200; do
            git fetch --no-tags --depth=$depth origin "$BASE_BRANCH" 2>/dev/null || true
            git fetch --no-tags --depth=$depth cip "refs/tags/$TAG" 2>/dev/null || true
            MB=$(git merge-base HEAD FETCH_HEAD 2>/dev/null || echo "")
            [ -n "$MB" ] && break
          done
          if [ -z "$MB" ]; then
            git fetch --unshallow origin "$BASE_BRANCH" 2>/dev/null || git fetch origin "$BASE_BRANCH"
            git fetch --unshallow cip "refs/tags/$TAG" 2>/dev/null || git fetch cip "refs/tags/$TAG"
            MB=$(git merge-base HEAD FETCH_HEAD 2>/dev/null || echo "")
          fi
          echo "merge_base=${MB:-unknown}" >> "$GITHUB_OUTPUT"
          UP=$(git rev-parse FETCH_HEAD)
          if [ -n "$MB" ]; then COUNT=$(git rev-list --count "$MB..$UP" 2>/dev/null || echo 0); else COUNT=$(git rev-list --count "$UP" 2>/dev/null || echo 0); fi
          echo "integrated_commits=$COUNT" >> "$GITHUB_OUTPUT"
          echo "merge_base=${MB:-unknown}"; echo "integrated_commits=$COUNT"
          {
            echo "merge_base=${MB:-unknown}"
            echo "range=${MB:-<root>}..$UP"
            echo "integrated_commits=$COUNT"
            echo "note=No upstream commits silently skipped; verified tag commit=$UP"
          } > "$MERGE_DIAG_DIR/commit-range.txt"

      # ---- Prepare dedicated upgrade branch ----
      - name: Create upgrade branch
        working-directory: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          git checkout -B "$UPGRADE_BRANCH"
          git config user.name "evernight-kernel-ci"
          git config user.email "ci@evernight.invalid"

      # ---- Incremental merge engine (never -X ours/-X theirs; no blind deletion; stop on uncertain conflicts) ----
      - name: Merge upstream CIP (careful; no silent skips)
        id: merge
        working-directory: ${{ github.workspace }}/src
        run: |
          set +e
          TAG="${{ inputs.upstream_tag || 'v4.19-st21' }}"
          MODE="${{ inputs.mode || 'single' }}"
          RESOLVED=0
          : > "$MERGE_DIAG_DIR/merge-conflicts.txt"
          : > "$MERGE_DIAG_DIR/unresolved-files.txt"
          : > "$MERGE_DIAG_DIR/failed-commits.txt"
          : > "$MERGE_DIAG_DIR/merge-errors.log"

          do_merge() {
            local ref="$1" label="$2"
            echo "::group::merge $label ($ref)"
            git merge --no-ff --no-commit --no-edit "$ref" >> "$MERGE_DIAG_DIR/merge-errors.log" 2>&1
            local rc=$?
            if [ $rc -ne 0 ]; then
              echo "merge conflict/failure for $label ($ref) rc=$rc" | tee -a "$MERGE_DIAG_DIR/merge-errors.log"
              echo "$label $ref" >> "$MERGE_DIAG_DIR/failed-commits.txt"
              git diff --name-only --diff-filter=U >> "$MERGE_DIAG_DIR/merge-conflicts.txt"
              git status --porcelain | awk '$1 ~ /^(UU|AA|DD|AU|UA|DU|UD)$/ {print $2}' >> "$MERGE_DIAG_DIR/merge-conflicts.txt"
              sort -u -o "$MERGE_DIAG_DIR/merge-conflicts.txt" "$MERGE_DIAG_DIR/merge-conflicts.txt"
              cp "$MERGE_DIAG_DIR/merge-conflicts.txt" "$MERGE_DIAG_DIR/unresolved-files.txt"
              echo "::endgroup::"
              return $rc
            fi
            echo "::endgroup::"
            return 0
          }

          if [ "$MODE" = "incremental" ]; then
            for n in $(seq 9 21); do
              T="v4.19-st$n"
              if git ls-remote --tags cip "$T" | grep -q .; then
                git fetch --no-tags --depth 1 cip "refs/tags/$T" 2>/dev/null || true
                do_merge FETCH_HEAD "$T"
                [ -s "$MERGE_DIAG_DIR/unresolved-files.txt" ] && break
              fi
            done
          else
            git fetch --no-tags --depth 1 cip "refs/tags/$TAG" 2>/dev/null || true
            do_merge FETCH_HEAD "$TAG"
          fi

          # ---- Careful conflict resolution: ONLY explicitly whitelisted, demonstrably compatible cases ----
          if git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
            git diff --name-only --diff-filter=U > "$MERGE_DIAG_DIR/merge-conflicts.txt" 2>/dev/null
            git status --porcelain | awk '$1 ~ /^(UU|AA|DD|AU|UA|DU|UD)$/ {print $2}' >> "$MERGE_DIAG_DIR/merge-conflicts.txt"
            sort -u -o "$MERGE_DIAG_DIR/merge-conflicts.txt" "$MERGE_DIAG_DIR/merge-conflicts.txt"

            SAFE=0
            # localversion-st: version bump only (no code/hardware); upstream owns it; set target
            if grep -qx 'localversion-st' "$MERGE_DIAG_DIR/merge-conflicts.txt"; then
              printf '%s\n' "${{ inputs.target_st || '-st21' }}" > localversion-st
              git add localversion-st
              echo "RESOLVED localversion-st -> ${{ inputs.target_st || '-st21' }} (version bump; no code)" >> "$MERGE_DIAG_DIR/merge-conflicts.txt"
              SAFE=$((SAFE+1))
            fi
            # localversion-cip: version bump only; set target
            if grep -qx 'localversion-cip' "$MERGE_DIAG_DIR/merge-conflicts.txt"; then
              printf '%s\n' "${{ inputs.target_cip || '-cip137' }}" > localversion-cip
              git add localversion-cip
              echo "RESOLVED localversion-cip -> ${{ inputs.target_cip || '-cip137' }} (version bump; no code)" >> "$MERGE_DIAG_DIR/merge-conflicts.txt"
              SAFE=$((SAFE+1))
            fi
            RESOLVED=$SAFE

            git diff --name-only --diff-filter=U > "$MERGE_DIAG_DIR/unresolved-files.txt" 2>/dev/null
            if [ -s "$MERGE_DIAG_DIR/unresolved-files.txt" ]; then
              echo "::error::unresolved conflicts remain; stopping (no silent resolution; no hardware guesses)"
              cp "$MERGE_DIAG_DIR/unresolved-files.txt" "$MERGE_DIAG_DIR/failed-commits.txt"
            fi
          fi

          echo "resolved_conflicts=$RESOLVED" >> "$GITHUB_OUTPUT"

          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . >> "$MERGE_DIAG_DIR/merge-errors.log" 2>/dev/null; then
            echo "::error::conflict markers found in tree"; echo conflict-markers >> "$MERGE_DIAG_DIR/unresolved-files.txt"
          fi

          if [ -s "$MERGE_DIAG_DIR/unresolved-files.txt" ]; then
            git merge --abort 2>/dev/null || true
            exit 1
          fi

          if git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
            git commit -m "Merge CIP $TAG into $UPGRADE_BRANCH (Evernight Kernel cip137-st21); upstream verified tag $TAG; no -X ours/-X theirs; device-specific changes preserved; conflicts resolved carefully (merge-conflicts.txt); no upstream commits silently skipped." \
              >> "$MERGE_DIAG_DIR/merge-errors.log" 2>&1 || { echo "::error::commit failed"; exit 1; }
          fi
          exit 0

      # ---- Set effective CIP/ST version after merge ----
      - name: Finalize effective version (4.19.325-cip137-st21)
        id: finalize
        working-directory: ${{ github.workspace }}/src
        if: success()
        run: |
          set -euo pipefail
          printf '%s\n' "${{ inputs.target_cip || '-cip137' }}" > localversion-cip
          printf '%s\n' "${{ inputs.target_st || '-st21' }}" > localversion-st
          git add localversion-cip localversion-st
          if ! git diff --cached --quiet; then
            git commit -m "Set CIP ${{ inputs.target_cip || '-cip137' }} / ST ${{ inputs.target_st || '-st21' }} -> effective 4.19.325-cip137-st21" || true
          fi
          KVER=$(awk '/^VERSION =/{v=$3}/^PATCHLEVEL =/{p=$3}/^SUBLEVEL =/{s=$3}END{print v"."p"."s}' Makefile)
          CIP=$(tr -d '[:space:]' < localversion-cip); ST=$(tr -d '[:space:]' < localversion-st)
          EFF="$KVER${CIP}${ST}"
          echo "effective_version=$EFF" | tee "$MERGE_DIAG_DIR/effective-version.txt"
          echo "effective_version=$EFF" >> "$GITHUB_OUTPUT"

      # ---- Source validation (static checks; no full build in Workflow A) ----
      - name: Source validation
        working-directory: ${{ github.workspace }}/src
        if: success()
        run: |
          set -euo pipefail
          git fsck --no-dangling || true
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ; then echo "::error::conflict markers"; exit 1; else echo "no conflict markers"; fi
          git diff --check HEAD~1..HEAD || { echo "::error::diff check failed"; exit 1; }
          test -z "$(git diff --name-only --diff-filter=U)" || { echo "::error::unmerged paths"; exit 1; }
          CHANGED=$(git diff --name-only HEAD~1..HEAD -- '*.c' '*.h' 2>/dev/null | head -n 50 || true)
          if [ -n "$CHANGED" ] && [ -x scripts/checkpatch.pl ]; then
            git diff HEAD~1..HEAD -- $CHANGED > "$GITHUB_WORKSPACE/changed.diff" 2>/dev/null || git diff HEAD~1..HEAD > "$GITHUB_WORKSPACE/changed.diff"
            perl scripts/checkpatch.pl --no-signoff --no-summary --terse "$GITHUB_WORKSPACE/changed.diff" || echo "checkpatch reported issues (non-fatal)"
          fi
          grep -q '^CONFIG_ARM64=y' arch/arm64/configs/earth_defconfig && echo "CONFIG_ARM64 present"
          test -f arch/arm64/configs/earth_defconfig && echo "earth_defconfig preserved"
          echo "source validation OK"

      # ---- Push resulting upgrade branch (only on success) ----
      - name: Push upgrade branch
        working-directory: ${{ github.workspace }}/src
        if: success()
        run: |
          set -euo pipefail
          git push --force-with-lease origin "$UPGRADE_BRANCH"
          echo "pushed=$UPGRADE_BRANCH"

      # ---- Source integrity report + compact merge summary ----
      - name: Generate source integrity + merge report
        if: always()
        run: |
          set +e
          cd "$GITHUB_WORKSPACE/src" 2>/dev/null
          {
            echo "Evernight Kernel — source integrity report"
            echo "generated=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "base_branch=${{ inputs.base_branch || 'lineage-23.2' }}"
            echo "upgrade_branch=$UPGRADE_BRANCH"
            echo "git_commit=$(git rev-parse HEAD 2>/dev/null || echo n/a)"
            echo "git_tree=$(git rev-parse 'HEAD^{tree}' 2>/dev/null || echo n/a)"
            echo "tracked_files_sha256_manifest="
            git ls-files -z 2>/dev/null | sort -z | xargs -0 sha256sum 2>/dev/null | sha256sum
          } > "$MERGE_DIAG_DIR/source-integrity.txt"
          {
            echo "Evernight Kernel — merge summary"
            echo "run=${{ github.run_id }}"
            echo "original=${{ inputs.original_version || '4.19.325-cip124-st8' }}"
            echo "target_tag=${{ inputs.upstream_tag || 'v4.19-st21' }}"
            echo "target_effective=4.19.325${{ inputs.target_cip || '-cip137' }}${{ inputs.target_st || '-st21' }}"
            echo "--- baseline ---";          cat "$MERGE_DIAG_DIR/baseline.txt" 2>/dev/null
            echo "--- upstream ---";         cat "$MERGE_DIAG_DIR/upstream.txt" 2>/dev/null
            echo "--- commit-range ---";     cat "$MERGE_DIAG_DIR/commit-range.txt" 2>/dev/null
            echo "--- effective-version ---";cat "$MERGE_DIAG_DIR/effective-version.txt" 2>/dev/null
            echo "--- merge-conflicts ---";  cat "$MERGE_DIAG_DIR/merge-conflicts.txt" 2>/dev/null
            echo "--- unresolved-files ---"; cat "$MERGE_DIAG_DIR/unresolved-files.txt" 2>/dev/null
            echo "--- failed-commits ---";   cat "$MERGE_DIAG_DIR/failed-commits.txt" 2>/dev/null
          } > "$MERGE_DIAG_DIR/merge-summary.txt"
          for f in merge-summary.txt merge-errors.log merge-conflicts.txt failed-commits.txt unresolved-files.txt source-integrity.txt; do
            [ -f "$MERGE_DIAG_DIR/$f" ] || : > "$MERGE_DIAG_DIR/$f"
          done
          ls -la "$MERGE_DIAG_DIR"

      # ---- Diagnostics upload ALWAYS; never overrides job status ----
      - name: Upload merge diagnostics (always; does not override job status)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-diagnostics
          path: ${{ github.workspace }}/merge-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

  # ---- Workflow chaining: build ONLY after successful merge ----
  build:
    name: Trigger kernel build
    needs: merge
    if: ${{ success() }}
    uses: ./.github/workflows/kernel-build.yml
    with:
      ref: ${{ needs.merge.outputs.upgrade_branch }}
      defconfig: earth_defconfig
      build_target: Image
      jobs: 4
    secrets: inherit
