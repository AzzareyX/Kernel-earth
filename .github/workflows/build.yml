name: Merge CIP into lineage-23.2

on:
  workflow_dispatch:
    inputs:
      source-branch:
        description: 'Branch to merge into'
        required: true
        default: 'lineage-23.2'
        type: string
      target-branch:
        description: 'Branch to create/push with the merge result'
        required: true
        default: 'cip/4.19.325-cip137-merge'
        type: string
      cip-base-tag:
        description: 'CIP tag matching the current localversion files'
        required: true
        default: 'v4.19.325-cip124'
        type: string
      cip-target-tag:
        description: 'CIP tag to merge (carries the -st version too)'
        required: true
        default: 'v4.19.325-cip137'
        type: string
      open-pr:
        description: 'Open a pull request for the merge branch'
        required: false
        default: true
        type: boolean
      dry-run:
        description: 'Resolve and verify locally, but do not push or open a PR'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-branch }}
          fetch-depth: 1
          token: ${{ secrets.CIP_MERGE_TOKEN || github.token }}

      - name: Fetch CIP base and target tags
        run: |
          set -euo pipefail
          git fetch --depth=1 https://gitlab.com/cip-project/cip-kernel/linux-cip.git \
            "refs/tags/${{ inputs.cip-base-tag }}:refs/tags/${{ inputs.cip-base-tag }}" \
            "refs/tags/${{ inputs.cip-target-tag }}:refs/tags/${{ inputs.cip-target-tag }}"

      - name: Merge, resolve all conflicts, commit and push
        env:
          SOURCE_BRANCH: ${{ inputs.source-branch }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
          CIP_BASE_TAG: ${{ inputs.cip-base-tag }}
          CIP_TARGET_TAG: ${{ inputs.cip-target-tag }}
          OPEN_PR: ${{ inputs.open-pr }}
          DRY_RUN: ${{ inputs.dry-run }}
          GH_TOKEN: ${{ secrets.CIP_MERGE_TOKEN || github.token }}
        run: |
          set -euo pipefail

          log()  { printf '[cip-merge] %s\n' "$*"; }
          fail() { printf '[cip-merge] ERROR: %s\n' "$*" >&2; exit 1; }
          warn() { printf '[cip-merge] WARNING: %s\n' "$*"; }

          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          [ "$(make -s kernelversion)" = "4.19.325" ] \
            || fail "expected kernel version 4.19.325"
          OURS="$(git rev-parse HEAD)"

          BASE_CIP="$(git show "$CIP_BASE_TAG:localversion-cip")"
          BASE_ST="$(git show "$CIP_BASE_TAG:localversion-st")"
          [ "$BASE_CIP" = "$(cat localversion-cip)" ] \
            || fail "localversion-cip is '$(cat localversion-cip)', base tag has '$BASE_CIP'"
          [ "$BASE_ST" = "$(cat localversion-st)" ] \
            || fail "localversion-st is '$(cat localversion-st)', base tag has '$BASE_ST'"

          CIP_TARGET="$(git rev-parse "$CIP_TARGET_TAG^{commit}")"
          TARGET_CIP="$(git show "$CIP_TARGET_TAG:localversion-cip")"
          TARGET_ST="$(git show "$CIP_TARGET_TAG:localversion-st")"
          log "target versions: $TARGET_CIP / $TARGET_ST"

          MERGE_TREE_HELP="$(git merge-tree -h 2>&1 || true)"
          case "$MERGE_TREE_HELP" in
            *merge-base*) ;;
            *) fail "git too old; git >= 2.38 required for merge-tree --merge-base" ;;
          esac

          log "computing synthetic 3-way merge"
          BASE_SYN="$(printf 'CIP base %s\n' "$CIP_BASE_TAG" \
            | git commit-tree "$(git rev-parse "$CIP_BASE_TAG^{tree}")")"
          OURS_SYN="$(printf 'vendor %s\n' "$SOURCE_BRANCH" \
            | git commit-tree "$(git rev-parse "$OURS^{tree}")")"
          THEIRS_SYN="$(printf 'CIP target %s\n' "$CIP_TARGET_TAG" \
            | git commit-tree "$(git rev-parse "$CIP_TARGET^{tree}")")"

          set +e
          git merge-tree --write-tree --merge-base="$BASE_SYN" \
            "$OURS_SYN" "$THEIRS_SYN" > "$TMP/merge.out"
          MERGE_RC=$?
          set -e
          [ "$MERGE_RC" -le 1 ] || fail "git merge-tree failed with status $MERGE_RC"

          MERGED_TREE="$(head -n1 "$TMP/merge.out")"
          git cat-file -e "$MERGED_TREE^{tree}" || fail "merge-tree produced no tree"

          cat > "$TMP/expected.txt" <<'EOF'
          drivers/gpu/drm/virtio/virtgpu_ioctl.c
          drivers/input/evdev.c
          drivers/net/ethernet/stmicro/stmmac/dwxgmac2.h
          drivers/net/ethernet/stmicro/stmmac/ring_mode.c
          drivers/usb/gadget/function/f_fs.c
          drivers/usb/gadget/function/f_hid.c
          drivers/usb/gadget/udc/core.c
          drivers/usb/host/xhci-hub.c
          fs/Makefile
          fs/f2fs/super.c
          fs/f2fs/sysfs.c
          fs/jbd2/transaction.c
          include/linux/bpf.h
          include/linux/fs.h
          include/net/sock.h
          kernel/bpf/core.c
          kernel/bpf/local_storage.c
          kernel/sched/core.c
          kernel/sched/cpufreq_schedutil.c
          mm/swapfile.c
          net/core/filter.c
          sound/core/pcm_lib.c
          virt/kvm/arm/mmu.c
          EOF
          grep -E '^[0-7]{6} ' "$TMP/merge.out" | cut -f2 | sort -u > "$TMP/actual.txt"
          sort -u "$TMP/expected.txt" > "$TMP/expected.sorted.txt"
          if ! diff -u "$TMP/expected.sorted.txt" "$TMP/actual.txt" > "$TMP/conflict.diff"; then
            cat "$TMP/conflict.diff" >&2
            fail "unexpected conflict set; do not reuse these resolutions for this tag"
          fi
          log "all $(wc -l < "$TMP/actual.txt") conflicts are covered by inline resolutions"

          git read-tree --reset -u "$MERGED_TREE"
          export CONFLICT_LIST="$TMP/expected.txt"

          python3 - <<'PY'
          import os
          import re

          CUSTOM = lambda s: ("custom", s)

          # One entry per conflict hunk, in file order.
          ACTIONS = {
              "drivers/gpu/drm/virtio/virtgpu_ioctl.c": [
                  CUSTOM("\t\tdrm_gem_object_put_unlocked(obj);\n"),
              ],
              "drivers/input/evdev.c": [
                  CUSTOM("\tmemset(&ev, 0, sizeof(ev));\n"),
              ],
              "drivers/net/ethernet/stmicro/stmmac/dwxgmac2.h": [
                  CUSTOM("#define XGMAC_DMA_INT_DEFAULT_EN\t(XGMAC_NIE | XGMAC_AIE | XGMAC_RIE | \\\n"
                         "\t\t\t\t\tXGMAC_TBUE | XGMAC_TIE)\n"),
              ],
              "drivers/net/ethernet/stmicro/stmmac/ring_mode.c": [
                  "theirs",
              ],
              "drivers/usb/gadget/function/f_fs.c": [
                  CUSTOM("\t/* to get updated opened atomic variable value */\n"
                         "\tsmp_mb__before_atomic();\n"
                         "\tatomic_set(&epfile->opened, 0);\n"
                         "\tatomic_set(&epfile->error, 1);\n"),
              ],
              "drivers/usb/gadget/function/f_hid.c": [
                  CUSTOM("\t/* HACK, replace content, duplicate code from above */\n"
                         "\thidg->bInterfaceSubClass = hid_data.subclass;\n"
                         "\thidg->bInterfaceProtocol = hid_data.protocol;\n"
                         "\thidg->report_length = hid_data.report_length;\n"
                         "\thidg->report_desc_length = hid_data.report_desc_length;\n"
                         "\thidg->report_desc = kmemdup(hid_data.report_desc,\n"
                         "\t\t\thid_data.report_desc_length,\n"
                         "\t\t\tGFP_KERNEL);\n"
                         "\tif (!hidg->report_desc) {\n"
                         "\t\tkfree(hidg);\n"
                         "\t\tmutex_unlock(&opts->lock);\n"
                         "\t\treturn ERR_PTR(-ENOMEM);\n"
                         "\t}\n"
                         "\n"
                         "\t++opts->refcnt;\n"),
              ],
              "drivers/usb/gadget/udc/core.c": [
                  CUSTOM("\tsysfs_remove_link(&udc->dev.kobj, \"gadget\");\n"
                         "\n"
                         "\t/*\n"
                         "\t * Set the teardown flag before flushing the work to prevent new work\n"
                         "\t * from being scheduled while we are cleaning up.\n"
                         "\t */\n"
                         "\tspin_lock_irqsave(&gadget->state_lock, flags);\n"
                         "\tgadget->teardown = true;\n"
                         "\tspin_unlock_irqrestore(&gadget->state_lock, flags);\n"),
              ],
              "drivers/usb/host/xhci-hub.c": [
                  "ours",
              ],
              "fs/Makefile": [
                  CUSTOM("\t\tfs_types.o fs_context.o fs_parser.o\n"),
              ],
              "fs/f2fs/super.c": [
                  CUSTOM("\n"
                         "\t\tif (err > 0) {\n"
                         "\t\t\tif (!f2fs_readonly(sb)) {\n"
                         "\t\t\t\tf2fs_err(sbi, \"Need to recover fsync data\");\n"
                         "\t\t\t\terr = -EINVAL;\n"
                         "\t\t\t\tgoto free_meta;\n"
                         "\t\t\t} else {\n"
                         "\t\t\t\tf2fs_info(sbi, \"drop all fsynced data\");\n"
                         "\t\t\t\terr = 0;\n"
                         "\t\t\t}\n"),
              ],
              "fs/f2fs/sysfs.c": [
                  "both",
                  CUSTOM("static void __sbi_store_value(struct f2fs_attr *a,\n"
                         "\t\t\tstruct f2fs_sb_info *sbi,\n"
                         "\t\t\tunsigned char *ui, unsigned long value)\n"
                         "{\n"
                         "\tswitch (a->size) {\n"
                         "\tcase 1:\n"
                         "\t\t*(u8 *)ui = value;\n"
                         "\t\tbreak;\n"
                         "\tcase 2:\n"
                         "\t\t*(u16 *)ui = value;\n"
                         "\t\tbreak;\n"
                         "\tcase 4:\n"
                         "\t\t*(u32 *)ui = value;\n"
                         "\t\tbreak;\n"
                         "\tcase 8:\n"
                         "\t\t*(u64 *)ui = value;\n"
                         "\t\tbreak;\n"
                         "\tdefault:\n"
                         "\t\tf2fs_bug_on(sbi, 1);\n"
                         "\t\tf2fs_err(sbi, \"store sysfs node value with wrong type\");\n"
                         "\t}\n"),
                  CUSTOM("\tif (!strcmp(a->attr.name, \"iostat_period_ms\")) {\n"
                         "\t\tif (t < MIN_IOSTAT_PERIOD_MS || t > MAX_IOSTAT_PERIOD_MS)\n"
                         "\t\t\treturn -EINVAL;\n"
                         "\t\tspin_lock(&sbi->iostat_lock);\n"
                         "\t\tsbi->iostat_period_ms = (unsigned int)t;\n"
                         "\t\tspin_unlock(&sbi->iostat_lock);\n"
                         "\t\treturn count;\n"
                         "\t}\n"
                         "\n"
                         "\t__sbi_store_value(a, sbi, ptr + a->offset, t);\n"),
              ],
              "fs/jbd2/transaction.c": [
                  "theirs",
              ],
              "include/linux/bpf.h": [
                  "ours",
              ],
              "include/linux/fs.h": [
                  CUSTOM("#include <linux/android_kabi.h>\n"
                         "#include <linux/fs_types.h>\n"),
              ],
              "include/net/sock.h": [
                  CUSTOM("#if IS_ENABLED(CONFIG_DEBUG_SPINLOCK) || IS_ENABLED(CONFIG_DEBUG_LOCK_ALLOC)\n"
                         "\tANDROID_KABI_RESERVE(1);\n"
                         "#else\n"
                         "\tANDROID_KABI_USE(1, spinlock_t sk_peer_lock);\n"
                         "#endif\n"
                         "\tANDROID_KABI_RESERVE(2);\n"
                         "\tANDROID_KABI_RESERVE(3);\n"
                         "\tANDROID_KABI_RESERVE(4);\n"
                         "\tANDROID_KABI_RESERVE(5);\n"
                         "\tANDROID_KABI_RESERVE(6);\n"
                         "\tANDROID_KABI_RESERVE(7);\n"
                         "\tANDROID_KABI_RESERVE(8);\n"
                         "#if IS_ENABLED(CONFIG_PROVE_LOCKING) && IS_ENABLED(CONFIG_MODULES)\n"
                         "\tstruct module\t\t*sk_owner;\n"
                         "#endif\n"),
              ],
              "kernel/bpf/core.c": [
                  "ours",
              ],
              "kernel/bpf/local_storage.c": [
                  "ours",
              ],
              "kernel/sched/core.c": [
                  CUSTOM("void sched_post_fork(struct task_struct *p)\n"
                         "{\n"
                         "\tuclamp_post_fork(p);\n"
                         "}\n"
                         "\n"
                         "u64 to_ratio(u64 period, u64 runtime)\n"),
              ],
              "kernel/sched/cpufreq_schedutil.c": [
                  CUSTOM("\tlist_for_each_entry(sg_policy, &attr_set->policy_list, tunables_hook) {\n"
                         "\t\tsg_policy->up_rate_delay_ns = (s64)rate_limit_us * NSEC_PER_USEC;\n"
                         "\t\tupdate_min_rate_limit_ns(sg_policy);\n"
                         "\t}\n"),
                  CUSTOM("\tsg_policy->up_rate_delay_ns =\n"
                         "\t\t(s64)sg_policy->tunables->up_rate_limit_us * NSEC_PER_USEC;\n"
                         "\tsg_policy->down_rate_delay_ns =\n"
                         "\t\t(s64)sg_policy->tunables->down_rate_limit_us * NSEC_PER_USEC;\n"
                         "\tupdate_min_rate_limit_ns(sg_policy);\n"),
              ],
              "mm/swapfile.c": [
                  CUSTOM("\tinode_lock(inode);\n"
                         "\tif (IS_SWAPFILE(inode)) {\n"
                         "\t\terror = -EBUSY;\n"
                         "\t\tgoto bad_swap_unlock_inode;\n"
                         "\t}\n"
                         "\tif (IS_ENCRYPTED(inode)) {\n"
                         "\t\tpr_warn_once(\n"
                         "\t\t\t\"Filesystem-level encrypted swapfile '%s' is unsupported. Create a loop device over it, or use dm-crypt\\n\",\n"
                         "\t\t\tname->name);\n"
                         "\t\terror = -EINVAL;\n"
                         "\t\tgoto bad_swap_unlock_inode;\n"
                         "\t}\n"),
              ],
              "net/core/filter.c": [
                  "ours",
                  "ours",
              ],
              "sound/core/pcm_lib.c": [
                  "theirs",
              ],
              "virt/kvm/arm/mmu.c": [
                  CUSTOM("\n"
                         "\t/*\n"
                         "\t * Read mmu_notifier_seq while still holding mmap_sem so that KVM can\n"
                         "\t * detect if the results of find_vma_intersection() (e.g. the huge\n"
                         "\t * page decision above) or gfn_to_pfn_prot() become stale prior to\n"
                         "\t * acquiring kvm->mmu_lock.  A competing VMA change has to take\n"
                         "\t * mmap_sem for write and the mmu notifier bumps mmu_notifier_seq\n"
                         "\t * under kvm->mmu_lock, so mmu_notifier_retry() will notice any\n"
                         "\t * change made once we drop mmap_sem.\n"
                         "\t */\n"
                         "\tmmu_seq = vcpu->kvm->mmu_notifier_seq;\n"
                         "\tmmap_read_unlock(current->mm);\n"),
              ],
          }

          MARKER = re.compile(
              r"^<<<<<<<[^\n]*\n(.*?)^=======\n(.*?)^>>>>>>>[^\n]*\n",
              re.MULTILINE | re.DOTALL,
          )

          def resolve(path, actions):
              with open(path, "r", encoding="utf-8", errors="surrogateescape") as f:
                  text = f.read()
              matches = list(MARKER.finditer(text))
              if len(matches) != len(actions):
                  raise SystemExit(
                      "%s: expected %d hunks, found %d" % (path, len(actions), len(matches))
                  )
              counter = iter(range(len(matches)))

              def repl(m):
                  action = actions[next(counter)]
                  if action == "ours":
                      return m.group(1)
                  if action == "theirs":
                      return m.group(2)
                  if action == "both":
                      return m.group(1) + m.group(2)
                  if isinstance(action, tuple) and action[0] == "custom":
                      return action[1]
                  raise SystemExit("%s: bad action %r" % (path, action))

              new = MARKER.sub(repl, text)
              if "<<<<<<<" in new or ">>>>>>>" in new:
                  raise SystemExit("%s: markers remain after resolution" % path)
              with open(path, "w", encoding="utf-8", errors="surrogateescape") as f:
                  f.write(new)
              print("[cip-merge] resolved %s (%d hunk(s))" % (path, len(matches)))

          with open(os.environ["CONFLICT_LIST"], "r", encoding="utf-8") as f:
              paths = [line.strip() for line in f if line.strip()]

          for path in paths:
              if path not in ACTIONS:
                  raise SystemExit("no inline resolution for %s" % path)
              resolve(path, ACTIONS[path])

          # Apply CIP's 64-bit overflow fix inside the vendor scheduler layout.
          cpu = "kernel/sched/cpufreq_schedutil.c"
          with open(cpu, "r", encoding="utf-8") as f:
              s = f.read()
          helper = ("static void sugov_update_rate_limit_us(struct sugov_policy *sg_policy)\n"
                    "{\n"
                    "\t/*\n"
                    "\t * Cast rate_limit_us before multiplication to force 64-bit arithmetic.\n"
                    "\t * Otherwise, on 32-bit platforms, both operands are converted to\n"
                    "\t * 32-bit unsigned long and the multiplication may overflow.\n"
                    "\t */\n"
                    "\tsg_policy->freq_update_delay_ns =\n"
                    "\t\t(s64)sg_policy->tunables->rate_limit_us * NSEC_PER_USEC;\n"
                    "}\n\n")
          if helper not in s:
              raise SystemExit("cpufreq helper block not found")
          s = s.replace(helper, "", 1)
          s = s.replace("sg_policy->up_rate_delay_ns = rate_limit_us * NSEC_PER_USEC;",
                        "sg_policy->up_rate_delay_ns = (s64)rate_limit_us * NSEC_PER_USEC;")
          s = s.replace("sg_policy->down_rate_delay_ns = rate_limit_us * NSEC_PER_USEC;",
                        "sg_policy->down_rate_delay_ns = (s64)rate_limit_us * NSEC_PER_USEC;")
          s = re.sub(r"(?<!\(s64\))(?<!\w)(sg_policy->tunables->(?:up|down)_rate_limit_us \* NSEC_PER_USEC)",
                     r"(s64)\1", s)
          s = re.sub(r"(?<!\(s64\))(?<!\w)(rate_limit_us \* NSEC_PER_USEC)",
                     r"(s64)\1", s)
          s = s.replace("(s64)(s64)", "(s64)")
          with open(cpu, "w", encoding="utf-8") as f:
              f.write(s)
          print("[cip-merge] applied CIP rate-limit overflow fix")
          PY

          printf '%s\n' "$TARGET_CIP" > localversion-cip
          printf '%s\n' "$TARGET_ST" > localversion-st

          log "running sanity checks"
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if grep -nE '^(<<<<<<<|=======|>>>>>>>) ' "$path"; then
              fail "unresolved merge marker in $path"
            fi
          done < "$TMP/expected.txt"

          [ "$(make -s kernelversion)" = "4.19.325" ] || fail "kernelversion changed unexpectedly"
          [ "$(cat localversion-cip)" = "$TARGET_CIP" ] || fail "localversion-cip mismatch"
          [ "$(cat localversion-st)" = "$TARGET_ST" ] || fail "localversion-st mismatch"

          git add -A
          if ! git diff --check --cached > "$TMP/whitespace.txt"; then
            warn "git diff --check reported whitespace issues (informational only):"
            sed 's/^/  /' "$TMP/whitespace.txt"
          fi

          TREE="$(git write-tree)"
          MSG="$(cat <<EOF
          Merge $CIP_TARGET_TAG into $SOURCE_BRANCH

          CIP: $CIP_BASE_TAG -> $CIP_TARGET_TAG (localversion-st $TARGET_ST)
          All 23 conflicts resolved by the inline rules in this workflow.
          EOF
          )"
          NEW_COMMIT="$(printf '%s\n' "$MSG" \
            | git commit-tree "$TREE" -p "$OURS" -p "$CIP_TARGET")"

          if [ "$DRY_RUN" = "true" ]; then
            log "dry run: would create merge commit $NEW_COMMIT on $TARGET_BRANCH"
            log "dry run: skipping push and pull request"
            exit 0
          fi

          git update-ref "refs/heads/$TARGET_BRANCH" "$NEW_COMMIT"
          git push --force origin "$NEW_COMMIT:refs/heads/$TARGET_BRANCH"
          log "pushed $TARGET_BRANCH ($NEW_COMMIT)"

          if [ "$OPEN_PR" = "true" ]; then
            PR_COUNT="$(gh pr list --head "$TARGET_BRANCH" --base "$SOURCE_BRANCH" \
              --json number --jq 'length')"
            if [ "$PR_COUNT" != "0" ]; then
              log "pull request for $TARGET_BRANCH already exists"
            else
              cat > "$TMP/pr.md" <<EOF
          Automated merge of \`$CIP_TARGET_TAG\` (CIP $TARGET_CIP / ST $TARGET_ST) into \`$SOURCE_BRANCH\`.

          - Merge base: \`$CIP_BASE_TAG\`, matching the localversion files on \`$SOURCE_BRANCH\`.
          - 23 conflicts resolved by inline rules in the workflow; see the workflow source for rationale.
          - No conflict markers remain; \`make kernelversion\` reports 4.19.325.
          - Please review vendor-specific resolutions (MediaTek, sdcardfs, uclamp, BPF) before merging.
          EOF
              gh pr create --base "$SOURCE_BRANCH" --head "$TARGET_BRANCH" \
                --title "Merge $CIP_TARGET_TAG into $SOURCE_BRANCH" \
                --body-file "$TMP/pr.md"
              log "opened pull request"
            fi
          fi

          log "done"

      - name: Summary
        if: always()
        run: |
          echo "### CIP merge" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`${{ inputs.source-branch }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: \`${{ inputs.target-branch }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- CIP: \`${{ inputs.cip-base-tag }}\` -> \`${{ inputs.cip-target-tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Conflicts: 23, resolved inline (no extra files needed)" >> "$GITHUB_STEP_SUMMARY"
