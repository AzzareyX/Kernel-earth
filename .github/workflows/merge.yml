name: Kernel CIP Merge / Upgrade (Manual - Redmi 12C / earth)

# Manual-only. Tidak memerlukan PAT / token eksternal:
# - clone repo publik memakai HTTPS anonim
# - artifact diunggah lewat runtime token bawaan GitHub Actions
# - permissions dibatasi hanya "contents: read"

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Repository kernel sumber (URL HTTPS)'
        required: true
        type: string
        default: 'https://github.com/LineageOS/android_kernel_xiaomi_earth.git'
      source_branch:
        description: 'Branch kernel sumber'
        required: true
        type: string
        default: 'lineage-23.2'
      cip_remote:
        description: 'Remote Linux CIP resmi (kernel.org; alternatif: https://gitlab.com/cip-project/cip-kernel/linux-cip.git)'
        required: true
        type: string
        default: 'https://git.kernel.org/pub/scm/linux/kernel/git/cip/linux-cip.git'
      cip_ref:
        description: 'Target CIP: "latest" (tag stabil terbaru), nama tag, atau nama branch'
        required: true
        type: string
        default: 'latest'
      base_cip_tag:
        description: 'Tag CIP terakhir yang sudah dikenal baik (hanya dipakai mode cherry-pick)'
        required: false
        type: string
        default: 'v4.19.325-cip124'
      merge_mode:
        description: 'Cara aplikasi update CIP. merge = default; cherry-pick = paling aman untuk vendor tree; rebase = eksperimen'
        required: true
        type: choice
        default: 'merge'
        options:
          - merge
          - cherry-pick
          - rebase
      auto_resolve:
        description: 'Coba auto-resolve 23 konflik CIP yang sudah dikenal sebelum membatalkan build'
        required: true
        type: choice
        default: 'true'
        options:
          - 'true'
          - 'false'
      defconfig:
        description: 'Defconfig kernel (arch/arm64/configs/<nama>)'
        required: true
        type: string
        default: 'earth_defconfig'
      arch:
        description: 'Arsitektur kernel'
        required: true
        type: string
        default: 'arm64'
      compiler:
        description: 'Toolchain yang dipakai'
        required: true
        type: choice
        default: 'gcc'
        options:
          - gcc
          - clang
      cross_compile:
        description: 'Prefix cross compiler 64-bit'
        required: true
        type: string
        default: 'aarch64-linux-gnu-'
      cross_compile_arm32:
        description: 'Prefix cross compiler 32-bit (vdso / 32-bit compat)'
        required: true
        type: string
        default: 'arm-linux-gnueabihf-'
      toolchain_repo:
        description: 'OPSIONAL: repo prebuilt toolchain (gcc/clang). Kosongkan untuk memakai cross toolchain Ubuntu'
        required: false
        type: string
        default: ''
      toolchain_branch:
        description: 'Branch repo prebuilt toolchain di atas'
        required: false
        type: string
        default: 'main'
      jobs:
        description: 'Jumlah paralel make (-j). Turunkan jika OOM'
        required: true
        type: string
        default: '4'
      anykernel3_repo:
        description: 'Repo AnyKernel3'
        required: true
        type: string
        default: 'https://github.com/osm0sis/AnyKernel3.git'
      anykernel3_branch:
        description: 'Branch AnyKernel3'
        required: true
        type: string
        default: 'master'
      device_codename:
        description: 'Codename device untuk anykernel.sh'
        required: true
        type: string
        default: 'earth'
      use_vendor_network:
        description: 'DIAGNOSTIC: pakai stack jaringan dari source HEAD (Wi-Fi/hotspot/data), bukan hasil merge CIP'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kernel-cip-${{ github.ref }}-${{ inputs.device_codename }}
  cancel-in-progress: false

jobs:
  merge-upgrade:
    name: Merge CIP -> Build -> Package
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      SOURCE_REPO: ${{ inputs.source_repo }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      CIP_REMOTE: ${{ inputs.cip_remote }}
      CIP_REF: ${{ inputs.cip_ref }}
      BASE_CIP_TAG: ${{ inputs.base_cip_tag }}
      MERGE_MODE: ${{ inputs.merge_mode }}
      DEFCONFIG: ${{ inputs.defconfig }}
      ARCH: ${{ inputs.arch }}
      COMPILER: ${{ inputs.compiler }}
      CROSS_COMPILE: ${{ inputs.cross_compile }}
      CROSS_COMPILE_ARM32: ${{ inputs.cross_compile_arm32 }}
      TOOLCHAIN_REPO: ${{ inputs.toolchain_repo }}
      TOOLCHAIN_BRANCH: ${{ inputs.toolchain_branch }}
      JOBS: ${{ inputs.jobs }}
      AK3_REPO: ${{ inputs.anykernel3_repo }}
      AK3_BRANCH: ${{ inputs.anykernel3_branch }}
      DEVICE: ${{ inputs.device_codename }}
      USE_VENDOR_NETWORK: ${{ inputs.use_vendor_network }}
      WORKDIR: ${{ github.workspace }}/kernel
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CONFLICT_DIR: ${{ github.workspace }}/conflict-logs

    steps:
      # ------------------------------------------------------------------
      # 0. Dependensi + ccache
      # ------------------------------------------------------------------
      - name: Install dependencies and ccache
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git ca-certificates curl bc bison flex zip unzip xz-utils \
            build-essential libssl-dev libncurses-dev ccache
          if [ "$COMPILER" = "clang" ]; then
            sudo apt-get install -y --no-install-recommends clang lld llvm
          else
            sudo apt-get install -y --no-install-recommends \
              gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
              gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
          fi
          ccache --version
          ccache -M 5G
          mkdir -p "$CCACHE_DIR"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ env.ARCH }}-${{ env.DEFCONFIG }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.ARCH }}-${{ env.DEFCONFIG }}-
            ccache-${{ runner.os }}-${{ env.ARCH }}-

      # ------------------------------------------------------------------
      # 1. Resolve target CIP (latest = tag stabil 4.19 non-RT terakhir)
      # ------------------------------------------------------------------
      - name: Resolve CIP target
        id: meta
        run: |
          set -euo pipefail
          if [ "$CIP_REF" = "latest" ]; then
            CIP_TAG="$(git ls-remote --tags --refs "$CIP_REMOTE" 'v4.19.*-cip*' \
              | awk '{print $2}' \
              | sed 's#^refs/tags/##' \
              | grep -v -- '-rt' \
              | grep -v -- '-rebase' \
              | sort -V \
              | tail -n 1)"
          else
            CIP_TAG="$CIP_REF"
          fi

          if [ -z "$CIP_TAG" ]; then
            echo "::error::Tidak bisa menentukan tag CIP terbaru dari $CIP_REMOTE"
            exit 1
          fi

          if git ls-remote --exit-code --tags "$CIP_REMOTE" "refs/tags/$CIP_TAG" >/dev/null 2>&1; then
            CIP_OBJ="refs/tags/$CIP_TAG"
          elif git ls-remote --exit-code --heads "$CIP_REMOTE" "refs/heads/$CIP_TAG" >/dev/null 2>&1; then
            CIP_OBJ="refs/heads/$CIP_TAG"
          else
            echo "::error::Ref '$CIP_TAG' tidak ditemukan (tag maupun branch) di $CIP_REMOTE"
            exit 1
          fi

          echo "cip_tag=$CIP_TAG" >> "$GITHUB_OUTPUT"
          echo "cip_obj=$CIP_OBJ" >> "$GITHUB_OUTPUT"
          echo "version=${CIP_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "### Target CIP: \`$CIP_TAG\` (\`${CIP_TAG#v}\`) via \`$CIP_OBJ\`" >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # 2. Clone source + daftarkan remote CIP resmi
      # ------------------------------------------------------------------
      - name: Clone kernel source and add CIP remote
        id: clone
        run: |
          set -euo pipefail
          git clone --single-branch --branch "$SOURCE_BRANCH" "$SOURCE_REPO" "$WORKDIR"
          cd "$WORKDIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add cip "$CIP_REMOTE"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Source: $SOURCE_REPO @ $SOURCE_BRANCH ($(git rev-parse --short HEAD))"

      - name: Fetch CIP commit
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          git fetch --no-tags cip "+${{ steps.meta.outputs.cip_obj }}:refs/remotes/cip/cip-target"
          echo "CIP commit: $(git rev-parse refs/remotes/cip/cip-target)"
          if [ "$MERGE_MODE" = "cherry-pick" ]; then
            git fetch --no-tags cip "+refs/tags/$BASE_CIP_TAG:refs/tags/$BASE_CIP_TAG"
          fi

      # ------------------------------------------------------------------
      # 3. Merge / cherry-pick / rebase + tangkap konflik
      # ------------------------------------------------------------------
      - name: Apply CIP upgrade
        id: apply
        run: |
          set -uo pipefail
          cd "$WORKDIR"
          mkdir -p "$CONFLICT_DIR"
          CIP_TARGET="refs/remotes/cip/cip-target"

          capture_conflict() {
            local reason="$1"
            {
              echo "CIP upgrade CONFLICT"
              echo "Reason        : $reason"
              echo "Source        : $SOURCE_REPO @ $SOURCE_BRANCH"
              echo "Source HEAD   : ${{ steps.clone.outputs.source_sha }}"
              echo "CIP target    : ${{ steps.meta.outputs.cip_tag }} ($(git rev-parse "$CIP_TARGET"))"
              echo "Mode          : $MERGE_MODE"
              echo "Auto-resolve  : ${{ inputs.auto_resolve }}"
              echo "Runner        : $RUNNER_OS / $RUNNER_ARCH"
              echo ""
              echo "Build sengaja DIBATALKAN. Selesaikan konflik dulu, lalu jalankan ulang workflow."
            } > "$CONFLICT_DIR/00-summary.txt"

            git status --porcelain=v2 --untracked-files=normal 2>/dev/null \
              | head -n 400 > "$CONFLICT_DIR/01-git-status.txt" || true
            git diff --name-only --diff-filter=U 2>/dev/null \
              | head -n 300 > "$CONFLICT_DIR/02-unmerged-paths.txt" || true
            git diff --no-ext-diff 2>/dev/null \
              | head -n 5000 > "$CONFLICT_DIR/03-conflict-diff.patch" || true
            git ls-files -u 2>/dev/null | head -n 500 > "$CONFLICT_DIR/04-unmerged-index.txt" || true
            git log --oneline --decorate -20 2>/dev/null > "$CONFLICT_DIR/05-recent-log.txt" || true
            (git merge-base HEAD "$CIP_TARGET" 2>/dev/null || echo "NO_COMMON_ANCESTOR") \
              > "$CONFLICT_DIR/06-merge-base.txt" || true
            git diff --stat 2>/dev/null | tail -n 250 > "$CONFLICT_DIR/07-diff-stat.txt" || true
            git diff --check 2>/dev/null | head -n 400 > "$CONFLICT_DIR/08-diff-check.txt" || true

            # Snapshot stage 2 (HEAD/vendor) vs stage 3 (CIP) per file, dipotong kecil.
            local n=0 tag f
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              n=$((n + 1))
              [ "$n" -le 30 ] || break
              tag="$(printf '%s' "$f" | tr '/ ' '__')"
              git show ":2:$f" 2>/dev/null | head -n 160 > "$CONFLICT_DIR/ours_${tag}.txt" || true
              git show ":3:$f" 2>/dev/null | head -n 160 > "$CONFLICT_DIR/theirs_${tag}.txt" || true
            done < "$CONFLICT_DIR/02-unmerged-paths.txt"

            echo "apply_status=conflict" >> "$GITHUB_OUTPUT"
            echo "### :warning: Konflik saat menerapkan \`${{ steps.meta.outputs.cip_tag }}\` (\`$reason\`)" >> "$GITHUB_STEP_SUMMARY"
            echo "Auto-resolve akan dicoba: \`${{ inputs.auto_resolve }}\`. Jika gagal, unduh artifact **cip-conflict-logs**." >> "$GITHUB_STEP_SUMMARY"
            APPLY_CONFLICT=1
            return 0
          }

          if [ "$MERGE_MODE" = "merge" ]; then
            EXTRA=""
            if ! git merge-base HEAD "$CIP_TARGET" >/dev/null 2>&1; then
              EXTRA="--allow-unrelated-histories"
              echo "::warning::Tidak ada common ancestor dengan CIP. Memakai --allow-unrelated-histories."
            fi
            # shellcheck disable=SC2086
            if ! git merge --no-ff --no-edit $EXTRA \
                 -m "Merge ${{ steps.meta.outputs.cip_tag }} into $SOURCE_BRANCH (manual CIP upgrade)" \
                 "$CIP_TARGET"; then
              capture_conflict "git merge gagal"
            fi

          elif [ "$MERGE_MODE" = "rebase" ]; then
            if git merge-base HEAD "$CIP_TARGET" >/dev/null 2>&1; then
              if ! git rebase "$CIP_TARGET"; then
                capture_conflict "git rebase gagal"
              fi
            else
              echo "::warning::Rebase dari history yang tidak berkaitan; memakai --root."
              if ! git rebase --onto "$CIP_TARGET" --root; then
                capture_conflict "git rebase --onto --root gagal"
              fi
            fi

          else # cherry-pick
            if [ -z "$BASE_CIP_TAG" ]; then
              capture_conflict "base_cip_tag kosong pada mode cherry-pick"
            fi
            if ! git rev-parse -q --verify "refs/tags/$BASE_CIP_TAG" >/dev/null; then
              capture_conflict "tag baseline $BASE_CIP_TAG tidak tersedia"
            fi
            COMMITS="$(git rev-list --reverse "$BASE_CIP_TAG..$CIP_TARGET")"
            echo "Cherry-pick $(echo "$COMMITS" | grep -c . || true) commit(s) $BASE_CIP_TAG..${{ steps.meta.outputs.cip_tag }}"
            for c in $COMMITS; do
              nparents="$(git rev-list --parents -n 1 "$c" | wc -w)"
              if [ "$nparents" -gt 2 ]; then
                if ! git cherry-pick -m 1 "$c"; then
                  capture_conflict "cherry-pick merge commit $c gagal"
                fi
              else
                if ! git cherry-pick "$c"; then
                  capture_conflict "cherry-pick $c gagal"
                fi
              fi
            done
          fi

          # Jangan menimpa status "conflict" dengan "ok" setelah return dari capture_conflict.
          if [ "${APPLY_CONFLICT:-0}" = "1" ]; then
            exit 0
          fi

          echo "apply_status=ok" >> "$GITHUB_OUTPUT"
          git diff --binary "origin/$SOURCE_BRANCH..HEAD" > "$GITHUB_WORKSPACE/cip-upgrade.patch" || true
          echo "### :white_check_mark: CIP \`${{ steps.meta.outputs.cip_tag }}\` berhasil diterapkan (mode: \`$MERGE_MODE\`)" >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # 3b. Auto-resolve konflik yang sudah dikenal (23 file earth lineage-23.2)
      # ------------------------------------------------------------------
      - name: Auto-resolve known CIP conflicts
        id: resolve
        if: steps.apply.outputs.apply_status == 'conflict' && inputs.auto_resolve
        run: |
          set -uo pipefail
          cd "$WORKDIR"

          # Resolver ditulis inline supaya workflow tidak bergantung pada file
          # yang harus di-commit lebih dulu ke repo kernel.
          cat > "$RUNNER_TEMP/resolve_cip.py" <<'PY'
          import pathlib, re, subprocess, sys
          R = pathlib.Path(sys.argv[1])
          P = re.compile(r'(?ms)^<<<<<<< HEAD\n(.*?)^=======\n(.*?)^>>>>>>>[^\n]*\n')
          def r(n, k, v=None): return (n, k, v)

          kabi = ('#if IS_ENABLED(CONFIG_DEBUG_SPINLOCK) || IS_ENABLED(CONFIG_DEBUG_LOCK_ALLOC)\n'
                  '\tANDROID_KABI_RESERVE(1);\n#else\n'
                  '\tANDROID_KABI_USE(1, spinlock_t sk_peer_lock);\n#endif\n'
                  '#if IS_ENABLED(CONFIG_PROVE_LOCKING) && IS_ENABLED(CONFIG_MODULES)\n'
                  '\tANDROID_KABI_USE(2, struct module *sk_owner);\n#else\n'
                  '\tANDROID_KABI_RESERVE(2);\n#endif\n'
                  + ''.join('\tANDROID_KABI_RESERVE(%d);\n' % i for i in range(3, 9)))

          RULES = {
          'drivers/gpu/drm/virtio/virtgpu_ioctl.c':[r('drm_gem_object_release(obj)','text','\t\tdrm_gem_object_put_unlocked(obj);\n')],
          'drivers/input/evdev.c':[r('ktime_get_boottime','ours')],
          'drivers/net/ethernet/stmicro/stmmac/dwxgmac2.h':[r('XGMAC_DMA_INT_DEFAULT_EN','ours')],
          'drivers/net/ethernet/stmicro/stmmac/ring_mode.c':[r('rx_q->priv_data','theirs')],
          'drivers/usb/gadget/function/f_fs.c':[r('smp_mb__before_atomic','ours')],
          'drivers/usb/gadget/function/f_hid.c':[r('hidg->report_desc = kmemdup','both')],
          'drivers/usb/gadget/udc/core.c':[
            r('sysfs_remove_link(&udc->dev.kobj','text',
              '\tspin_lock_irqsave(&gadget->state_lock, flags);\n'
              '\tgadget->teardown = true;\n'
              '\tspin_unlock_irqrestore(&gadget->state_lock, flags);\n'
              '\tsysfs_remove_link(&udc->dev.kobj, "gadget");\n'),
            r('spin_lock_irqsave(&gadget->state_lock','theirs')],
          'drivers/usb/host/xhci-hub.c':[r('run_graceperiod','theirs')],
          'fs/Makefile':[r('fs_context.o','text','\t\tfs_context.o fs_parser.o fs_types.o\n')],
          'fs/f2fs/super.c':[r('Need to recover fsync data','text',
              '\t\tif (err > 0) {\n\t\t\tif (!f2fs_readonly(sb)) {\n'
              '\t\t\t\tf2fs_err(sbi, "Need to recover fsync data");\n'
              '\t\t\t\terr = -EINVAL;\n\t\t\t\tgoto free_meta;\n'
              '\t\t\t} else {\n'
              '\t\t\t\tf2fs_err(sbi, "drop all fsynced data (readonly)");\n'
              '\t\t\t\terr = 0;\n\t\t\t}')],
          'fs/f2fs/sysfs.c':[
            r('avg_vblocks_show','both'),
            r('return sprintf(buf, "%u\\n", *ui);','theirs'),
            r('iostat_period_ms','text',
              '\tif (!strcmp(a->attr.name, "iostat_period_ms")) {\n'
              '\t\tif (t < MIN_IOSTAT_PERIOD_MS || t > MAX_IOSTAT_PERIOD_MS)\n'
              '\t\t\treturn -EINVAL;\n\t\tspin_lock(&sbi->iostat_lock);\n'
              '\t\tsbi->iostat_period_ms = (unsigned int)t;\n'
              '\t\tspin_unlock(&sbi->iostat_lock);\n\t\treturn count;\n\t}\n\n'
              '\t__sbi_store_value(a, sbi, ptr + a->offset, t);\n')],
          'fs/jbd2/transaction.c':[r('rwsem_acquire_read','theirs')],
          'include/linux/bpf.h':[r('owner_prog_type','text',
              '\tstruct bpf_array_aux *aux;\n\tenum bpf_prog_type owner_prog_type;\n'
              '\tbool owner_jited;\n\tenum bpf_attach_type owner_attach_type;\n')],
          'include/linux/fs.h':[r('android_kabi.h','text',
              '#include <linux/android_kabi.h>\n#include <linux/fs_types.h>\n')],
          'include/net/sock.h':[r('ANDROID_KABI_USE(1, spinlock_t sk_peer_lock)','text',kabi)],
          'kernel/bpf/core.c':[r('array->aux->owner','text',
              '\t\tarray->owner_prog_type = fp->type;\n\t\tarray->owner_jited = fp->jited;\n'
              '\t\tarray->owner_attach_type = fp->expected_attach_type;\n\n'
              '\t\treturn true;\n\t}\n\n'
              '\treturn array->owner_prog_type == fp->type &&\n'
              '\t       array->owner_jited == fp->jited &&\n'
              '\t       array->owner_attach_type == fp->expected_attach_type;\n')],
          'kernel/bpf/local_storage.c':[r('list_next_entry(storage, list_map)','text',
              '\t\tstorage = list_next_entry(storage, list_map);\n'
              '\t\tif (list_entry_is_head(storage, &map->list, list_map))\n')],
          'kernel/sched/core.c':[r('uclamp_post_fork','text',
              'void sched_post_fork(struct task_struct *p)\n{\n\tuclamp_post_fork(p);\n}\n\n'
              'u64 to_ratio(u64 period, u64 runtime)\n')],
          'kernel/sched/cpufreq_schedutil.c':[
            # pakai helper ala CIP, lalu POST-fix isinya dengan field vendor
            r('sugov_update_rate_limit_us(sg_policy);','theirs')],
          'mm/swapfile.c':[r('IS_SWAPFILE(inode)','text',
              '\tinode_lock(inode);\n\tif (IS_SWAPFILE(inode)) {\n'
              '\t\terror = -EBUSY;\n\t\tgoto bad_swap_unlock_inode;\n\t}\n'
              '\tif (IS_ENCRYPTED(inode)) {\n\t\tpr_warn_once(\n'
              '\t\t\t"Filesystem-level encrypted swapfile \'%s\' is unsupported. Create a loop device over it, or use dm-crypt\\n",\n'
              '\t\t\tname->name);\n\t\terror = -EINVAL;\n'
              '\t\tgoto bad_swap_unlock_inode;\n\t}\n\n')],
          'net/core/filter.c':[
            r('sizeof_field(OBJ, OBJ_FIELD)','theirs'),
            r('SOCK_OPS_GET_SK()','theirs')],
          'sound/core/pcm_lib.c':[r('Modified by MTK','theirs')],
          'virt/kvm/arm/mmu.c':[r('mmap_read_unlock(current->mm);','theirs')],
          }
          POST = {
          'kernel/sched/sched.h':[('unsigned long to_ratio(','u64 to_ratio(')],
          'drivers/net/ethernet/stmicro/stmmac/ring_mode.c':[
            ('static void refill_desc3(void *priv_ptr, struct dma_desc *p)',
             'static void refill_desc3(struct stmmac_rx_queue *rx_q, struct dma_desc *p)')],
          # schedutil: pakai nama field vendor/MediaTek, bukan CIP murni
          'kernel/sched/cpufreq_schedutil.c':[
            ('freq_update_delay_ns', 'up_rate_delay_ns'),
            ('tunables->rate_limit_us', 'tunables->up_rate_limit_us')],
          # bpf_trace: static inline + varargs ditolak toolchain gcc-12
          'kernel/trace/bpf_trace.c':[
            ('static inline __printf(1, 0) int bpf_do_trace_printk(',
             'static __printf(1, 0) int bpf_do_trace_printk(')],
          # blk-crypto: CIP menyisakan deklarasi inline tanpa body
          'include/linux/keyslot-manager.h':[
            ('inline void ksm_', 'void ksm_'),
            ('inline int ksm_', 'int ksm_')],
          'include/linux/blk-crypto.h':[
            ('inline void blk_crypto_flock(struct keyslot_manager *ksm, unsigned int flags);',
             'void blk_crypto_flock(struct keyslot_manager *ksm, unsigned int flags);')],
          # richtek: offset adalah ptrdiff_t, bukan int
          'sound/soc/codecs/richtek_spm_cls.c':[
            ('pr_info("%s: %d\\n", __func__, offset);',
             'pr_info("%s: %ld\\n", __func__, (long)offset);'),
            ('dev_info(dev, "%s: %d\\n", __func__, offset);',
             'dev_info(dev, "%s: %ld\\n", __func__, (long)offset);')],
          # mtk-usip: arg adalah unsigned long, bukan unsigned int
          'sound/soc/mediatek/common/mtk-usip.c':[
            ('Fail copy CALL_ENH_CONFIG from user Ptr: %x',
             'Fail copy CALL_ENH_CONFIG from user Ptr: %lx'),
            ('memory_size = %ld addr_phy = 0x%llx',
             'memory_size = %zu addr_phy = 0x%llx')],
          # btcvsd: irq status dibaca ke u32, bukan unsigned long
          'sound/soc/mediatek/common/mtk-btcvsd.c':[
            ('bt_reg_ctl = 0x%lx', 'bt_reg_ctl = 0x%x')],
          # mtk-vcu: tmp->pa adalah unsigned long; cook/va adalah void *
          'drivers/media/platform/mtk-vcu/mtk_vcodec_mem.c':[
            ('Free cmdq pa %llx ref_cnt = %d',
             'Free cmdq pa %lx ref_cnt = %d'),
            ('iova = %llx va = %llx va_id = %lld',
             'iova = %llx va = %p va_id = %lld'),
            ('Free buff = %d iova = %llx va = %llx va_id = %llx',
             'Free buff = %d iova = %llx va = %p va_id = %llx')],
          # mtk-vcodec: sgt adalah struct sg_table *; satu format kehilangan arg
          'drivers/media/platform/mtk-vcodec/mtk_vcodec_dec.c':[
            ('mtk_v4l2_err("dma_buf_map_attachment fail %d.\\n", sgt);',
             'mtk_v4l2_err("dma_buf_map_attachment fail %p.\\n", sgt);'),
            ('mtk_v4l2_err("[%d]Error!!src_buf is NULL!");',
             'mtk_v4l2_err("Error!!src_buf is NULL!");')],
          'drivers/media/platform/mtk-vcodec/mtk_vcodec_enc.c':[
            ('mtk_v4l2_err("dma_buf_map_attachment fail %d.\\n", sgt);',
             'mtk_v4l2_err("dma_buf_map_attachment fail %p.\\n", sgt);')],
          # -Werror=memset-elt-size: ARRAY_SIZE() adalah jumlah elemen, bukan byte.
          # Baris 523 juga salah sasaran (count_ack), jadi pakai sizeof(max_load).
          'drivers/misc/mediatek/base/power/cm_mgr_v1/mtk_cm_mgr.c':[
            ('memset(count_ack, 0, ARRAY_SIZE(count_ack));',
             'memset(count_ack, 0, sizeof(count_ack));'),
            ('memset(max_load, 0, ARRAY_SIZE(count_ack));',
             'memset(max_load, 0, sizeof(max_load));')],
          # pbm: format [%s] butuh __func__; arg kedua adalah volt (bukan string)
          'drivers/misc/mediatek/base/power/pbm_v4/mtk_pbm.c':[
            ('pr_notice_ratelimited("[%s] wrong volt=%d, set 4V\\n",\n\t\t\tbat_vol);',
             'pr_notice_ratelimited("[%s] wrong volt=%d, set 4V\\n",\n\t\t\t__func__, bat_vol);')],
          # camera_dpe: dua LOG_INF setelah if tanpa brace diindentasi 2 tab,
          # seolah ikut terlindungi. Turunkan 1 tab (perilaku sama, warning hilang).
          'drivers/misc/mediatek/cameraisp/dpe/mt6768/camera_dpe.c':[
            ('\t\tLOG_INF("DVE:bFound:%d, DveWriteIdx:%d, WriteIdx:%d\\n",',
             '\tLOG_INF("DVE:bFound:%d, DveWriteIdx:%d, WriteIdx:%d\\n",'),
            ('\t\tLOG_INF("DVE:gDveCnt:%d,RequestState:%d,HWIdx:%d\\n",',
             '\tLOG_INF("DVE:gDveCnt:%d,RequestState:%d,HWIdx:%d\\n",')],
          # cmdq: sizeof sumber memicu -Wsizeof-pointer-memaccess; pakai
          # ukuran destination (NAME_MAX) yang memang lebih besar.
          'drivers/misc/mediatek/cmdq/v3/cmdq_sec_mtee.c':[
            ('strncpy(tee->ta_uuid, ta_uuid, sizeof(ta_uuid));',
             'strncpy(tee->ta_uuid, ta_uuid, sizeof(tee->ta_uuid));'),
            ('strncpy(tee->wsm_uuid, wsm_uuid, sizeof(wsm_uuid));',
             'strncpy(tee->wsm_uuid, wsm_uuid, sizeof(tee->wsm_uuid));')],
          # musb_qmu: string literal 3 baris tanpa kutip pembuka/penutup per
          # baris. Ini hard error ("missing terminating \" character"), bukan
          # warning, jadi tidak bisa ditekan dengan KCFLAGS. Tutup tiap baris
          # dan buka literal berikutnya agar pesannya tetap sama.
          'drivers/misc/mediatek/usb20/musb_qmu.c':[
            ('\t\t\tpr_debug("<ratelimit> avg sleep(%lu/%d, %lu)us,\n'
             '\t\t\tavg wake(%lu/%d, %lu)us, mode<%d,%d>,\n'
             '\t\t\tlocal balanced<%d,%d>\\n"',
             '\t\t\tpr_debug("<ratelimit> avg sleep(%lu/%d, %lu)us, "\n'
             '\t\t\t"avg wake(%lu/%d, %lu)us, mode<%d,%d>, "\n'
             '\t\t\t"local balanced<%d,%d>\\n"')],
          }
          def render(k, o, t, v):
              if k == 'ours': return o
              if k == 'theirs': return t
              if k == 'both': return o.rstrip('\n') + '\n\n' + t.lstrip('\n')
              return v
          bad = []
          for path, rules in RULES.items():
              p = R / path
              if not p.is_file():
                  bad.append('MISSING ' + path); continue
              s = p.read_text(); ms = list(P.finditer(s))
              if not ms:
                  print('SKIP (no markers): ' + path); continue
              out = []; pos = 0; handled = 0
              for m in ms:
                  o, t = m.group(1), m.group(2)
                  pick = next(((k, v) for n, k, v in rules if n in o + t), None)
                  if pick is None:
                      bad.append('UNHANDLED %s: %s' % (
                          path, m.group(0)[:200].replace('\n', '\\n')))
                      continue
                  handled += 1
                  out += [s[pos:m.start()], render(pick[0], o, t, pick[1])]
                  pos = m.end()
              if handled == len(ms):
                  out.append(s[pos:]); p.write_text(''.join(out))
                  print('OK %s: %d/%d block(s)' % (path, handled, len(ms)))
          for path, subs in POST.items():
              p = R / path
              if p.is_file():
                  s = p.read_text(); old = s
                  for a, b in subs: s = s.replace(a, b)
                  if s != old:
                      p.write_text(s)
                      print('POST-FIX: ' + path)
          # f2fs_msg(sb, level, ...) tidak ada di vendor tree. CIP menyisipkannya
          # di file non-konflik juga (mis. checkpoint.c), jadi sweep semua file.
          F2FS_MSG = [
            ('f2fs_msg(sbi->sb, KERN_ERR,', 'f2fs_err(sbi,'),
            ('f2fs_msg(sbi->sb, KERN_WARNING,', 'f2fs_err(sbi,'),
            ('f2fs_msg(sbi->sb, KERN_NOTICE,', 'f2fs_err(sbi,'),
            ('f2fs_msg(sbi->sb, KERN_INFO,', 'f2fs_err(sbi,'),
            ('f2fs_msg(sbi->sb, KERN_DEBUG,', 'f2fs_err(sbi,'),
            ('f2fs_msg(sb, KERN_ERR,', 'f2fs_err(F2FS_SB(sb),'),
            ('f2fs_msg(sb, KERN_WARNING,', 'f2fs_err(F2FS_SB(sb),'),
            ('f2fs_msg(sb, KERN_NOTICE,', 'f2fs_err(F2FS_SB(sb),'),
            ('f2fs_msg(sb, KERN_INFO,', 'f2fs_err(F2FS_SB(sb),'),
            ('f2fs_msg(sb, KERN_DEBUG,', 'f2fs_err(F2FS_SB(sb),')]
          for p in sorted((R / 'fs/f2fs').glob('*.[ch]')):
              s = p.read_text(); old = s
              for a, b in F2FS_MSG: s = s.replace(a, b)
              if s != old:
                  p.write_text(s)
                  print('POST-FIX: %s (f2fs_msg)' % p.relative_to(R))
          # chipone touch: source memakai 4 spasi untuk if/cts_err tetapi satu
          # tab untuk return ret, sehingga -Werror=misleading-indentation:
          # mengeluh. Samakan ke tab (CRLF juga dinormalkan jadi LF).
          p = R / 'drivers/input/touchscreen/mediatek/chipone_ICNL_9916/cts_core.c'
          if p.is_file():
              s = p.read_text()
              old = ('    if (ret)\n'
                     '        cts_err("Send CMD_CHARGER_%s failed %d", attached ? "ATTACHED" : "DETACHED", ret);\n'
                     '\n'
                     '\treturn ret;')
              new = ('\tif (ret)\n'
                     '\t\tcts_err("Send CMD_CHARGER_%s failed %d", attached ? "ATTACHED" : "DETACHED", ret);\n'
                     '\n'
                     '\treturn ret;')
              if old in s:
                  p.write_text(s.replace(old, new, 1))
                  print('POST-FIX: cts_core.c indentation')
              elif '\tif (ret)\n\t\tcts_err("Send CMD_CHARGER_' not in s:
                  print('WARN: cts_core.c indentation pattern not found')
          # CIP memanggil sugov_update_rate_limit_us(); pastikan helper itu ada
          # dan memakai field vendor (up_rate_limit_us / up_rate_delay_ns).
          p = R / 'kernel/sched/cpufreq_schedutil.c'
          if p.is_file():
              s = p.read_text()
              if ('sugov_update_rate_limit_us(' in s and
                  'void sugov_update_rate_limit_us(' not in s):
                  anchor = 'static void sugov_update_single('
                  helper = (
                      'static inline void sugov_update_rate_limit_us('
                      'struct sugov_policy *sg_policy)\n{\n'
                      '\tsg_policy->up_rate_delay_ns =\n'
                      '\t\tsg_policy->tunables->up_rate_limit_us * NSEC_PER_USEC;\n'
                      '\tupdate_min_rate_limit_ns(sg_policy);\n}\n\n')
                  if anchor in s:
                      s = s.replace(anchor, helper + anchor, 1)
                      p.write_text(s)
                      print('POST-FIX: sugov_update_rate_limit_us helper')
          # filter.c: HEAD menyimpan case vendor (SOCK_OPS_GET_TCP_SOCK_FIELD /
          # SOCK_OPS_GET_SK) di LUAR blok konflik. CIP menghapus macro itu, jadi
          # resolver per-blok tidak cukup. Ambil seluruh fungsi dari CIP, lalu
          # tambahkan kembali hanya case vendor yang memang tidak ada di CIP.
          p = R / 'net/core/filter.c'
          if p.is_file():
              s = p.read_text()
              try:
                cip_src = subprocess.check_output(
                  ['git','-C',str(R),'show',
                   'refs/remotes/cip/cip-target:net/core/filter.c'], text=True)
                ca = cip_src.index('static u32 sock_ops_convert_ctx_access(')
                cb = cip_src.index('\nstatic u32 sk_skb_convert_ctx_access(', ca)
                fn = cip_src[ca:cb]
                head_src = subprocess.check_output(
                  ['git','-C',str(R),'show','HEAD:net/core/filter.c'], text=True)
                # CIP menyamakan sizeof(bpf_sock_ops.op) dengan kern.op,
                # tetapi vendor memakai u8 di kern (UAPI u32). Ambil case
                # op/reply dari HEAD supaya BUILD_BUG_ON tidak gagal.
                cip_op = (
                  '\tcase offsetof(struct bpf_sock_ops, op) ...\n'
                  '\t     offsetof(struct bpf_sock_ops, replylong[3]):\n'
                  '\t\tBUILD_BUG_ON(FIELD_SIZEOF(struct bpf_sock_ops, op) !=\n'
                  '\t\t\t     FIELD_SIZEOF(struct bpf_sock_ops_kern, op));\n'
                  '\t\tBUILD_BUG_ON(FIELD_SIZEOF(struct bpf_sock_ops, reply) !=\n'
                  '\t\t\t     FIELD_SIZEOF(struct bpf_sock_ops_kern, reply));\n'
                  '\t\tBUILD_BUG_ON(FIELD_SIZEOF(struct bpf_sock_ops, replylong) !=\n'
                  '\t\t\t     FIELD_SIZEOF(struct bpf_sock_ops_kern, replylong));\n'
                  '\t\toff = si->off;\n'
                  '\t\toff -= offsetof(struct bpf_sock_ops, op);\n'
                  '\t\toff += offsetof(struct bpf_sock_ops_kern, op);\n'
                  '\t\tif (type == BPF_WRITE)\n'
                  '\t\t\t*insn++ = BPF_STX_MEM(BPF_W, si->dst_reg, si->src_reg,\n'
                  '\t\t\t\t\t      off);\n'
                  '\t\telse\n'
                  '\t\t\t*insn++ = BPF_LDX_MEM(BPF_W, si->dst_reg, si->src_reg,\n'
                  '\t\t\t\t\t      off);\n'
                  '\t\tbreak;\n\n')
                ha = head_src.index('\tcase offsetof(struct bpf_sock_ops, op):')
                hb = head_src.index('\tcase offsetof(struct bpf_sock_ops, family):', ha)
                if cip_op in fn:
                  fn = fn.replace(cip_op, head_src[ha:hb], 1)
                # Makro vendor menyelamatkan R9 saat dst == src; CIP tidak.
                def macro_of(head, start, end):
                  a = head.index(start)
                  return head[a:head.index(end, a)]
                head_get = macro_of(head_src, '#define SOCK_OPS_GET_FIELD(',
                                    '\n#define SOCK_OPS_GET_SK()')
                head_sk = macro_of(head_src, '#define SOCK_OPS_GET_SK()',
                                   '\n#define SOCK_OPS_GET_TCP_SOCK_FIELD(')
                head_set = macro_of(head_src, '#define SOCK_OPS_SET_FIELD(',
                                    '\n#define SOCK_OPS_GET_OR_SET_FIELD(')
                ga = fn.index('#define SOCK_OPS_GET_FIELD(')
                gb = fn.index('\n\n\tswitch (si->off) {', ga)
                fn = fn[:ga] + '#undef SOCK_OPS_GET_FIELD\n' + head_get + fn[gb:]
                sa = fn.index('#define SOCK_OPS_SET_FIELD(')
                sb = fn.index('\n\n#define SOCK_OPS_GET_OR_SET_FIELD(', sa)
                fn = fn[:sa] + '#undef SOCK_OPS_SET_FIELD\n' + head_set + fn[sb:]
                if '/* Helper macro for adding read access' in fn:
                  fn = fn.replace('/* Helper macro for adding read access',
                                  head_sk + '/* Helper macro for adding read access', 1)
                vendor_cases = (
                  "\tcase offsetof(struct bpf_sock_ops, sk):\n"
                  "\t\tSOCK_OPS_GET_SK();\n"
                  "\t\tbreak;\n"
                  "\tcase offsetof(struct bpf_sock_ops, skb_data_end):\n"
                  "\t\t*insn++ = BPF_LDX_MEM(BPF_FIELD_SIZEOF(struct bpf_sock_ops_kern,\n"
                  "\t\t\t\t\t\t       skb_data_end),\n"
                  "\t\t\t\t\t      si->dst_reg, si->src_reg,\n"
                  "\t\t\t\t\t      offsetof(struct bpf_sock_ops_kern,\n"
                  "\t\t\t\t\t\t       skb_data_end));\n"
                  "\t\tbreak;\n"
                  "\tcase offsetof(struct bpf_sock_ops, skb_data):\n"
                  "\t\t*insn++ = BPF_LDX_MEM(BPF_FIELD_SIZEOF(struct bpf_sock_ops_kern,\n"
                  "\t\t\t\t\t\t       skb),\n"
                  "\t\t\t\t\t      si->dst_reg, si->src_reg,\n"
                  "\t\t\t\t\t      offsetof(struct bpf_sock_ops_kern, skb));\n"
                  "\t\t*insn++ = BPF_JMP_IMM(BPF_JEQ, si->dst_reg, 0, 1);\n"
                  "\t\t*insn++ = BPF_LDX_MEM(BPF_FIELD_SIZEOF(struct sk_buff, data),\n"
                  "\t\t\t\t\t      si->dst_reg, si->dst_reg,\n"
                  "\t\t\t\t\t      offsetof(struct sk_buff, data));\n"
                  "\t\tbreak;\n"
                  "\tcase offsetof(struct bpf_sock_ops, skb_len):\n"
                  "\t\t*insn++ = BPF_LDX_MEM(BPF_FIELD_SIZEOF(struct bpf_sock_ops_kern,\n"
                  "\t\t\t\t\t\t       skb),\n"
                  "\t\t\t\t\t      si->dst_reg, si->src_reg,\n"
                  "\t\t\t\t\t      offsetof(struct bpf_sock_ops_kern, skb));\n"
                  "\t\t*insn++ = BPF_JMP_IMM(BPF_JEQ, si->dst_reg, 0, 1);\n"
                  "\t\t*insn++ = BPF_LDX_MEM(BPF_FIELD_SIZEOF(struct sk_buff, len),\n"
                  "\t\t\t\t\t      si->dst_reg, si->dst_reg,\n"
                  "\t\t\t\t\t      offsetof(struct sk_buff, len));\n"
                  "\t\tbreak;\n"
                  "\tcase offsetof(struct bpf_sock_ops, skb_tcp_flags):\n"
                  "\t\toff = offsetof(struct sk_buff, cb);\n"
                  "\t\toff += offsetof(struct tcp_skb_cb, tcp_flags);\n"
                  "\t\t*target_size = FIELD_SIZEOF(struct tcp_skb_cb, tcp_flags);\n"
                  "\t\t*insn++ = BPF_LDX_MEM(BPF_FIELD_SIZEOF(struct bpf_sock_ops_kern,\n"
                  "\t\t\t\t\t\t       skb),\n"
                  "\t\t\t\t\t      si->dst_reg, si->src_reg,\n"
                  "\t\t\t\t\t      offsetof(struct bpf_sock_ops_kern, skb));\n"
                  "\t\t*insn++ = BPF_JMP_IMM(BPF_JEQ, si->dst_reg, 0, 1);\n"
                  "\t\t*insn++ = BPF_LDX_MEM(BPF_FIELD_SIZEOF(struct tcp_skb_cb,\n"
                  "\t\t\t\t\t\t       tcp_flags),\n"
                  "\t\t\t\t\t      si->dst_reg, si->dst_reg, off);\n"
                  "\t\tbreak;\n")
                tail = '\n\t}\n\treturn insn - insn_buf;\n}'
                if tail in fn:
                  fn = fn.replace(tail, '\n' + vendor_cases + tail, 1)
                ma = s.index('static u32 sock_ops_convert_ctx_access(')
                mb = s.index('\nstatic u32 sk_skb_convert_ctx_access(', ma)
                p.write_text(s[:ma] + fn + s[mb:])
                print('POST-FIX: net/core/filter.c (sock_ops from CIP + vendor cases)')
              except (subprocess.CalledProcessError, ValueError) as exc:
                bad.append('filter.c CIP function replacement failed: ' + str(exc))
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('AUTO_RESOLVE_OK')
          PY

          if python3 "$RUNNER_TEMP/resolve_cip.py" "$WORKDIR" 2>&1 | tee "$CONFLICT_DIR/09-auto-resolve.log"; then
            RESOLVER_RC=0
          else
            RESOLVER_RC=1
          fi

          # PENTING: daftar unmerged harus diambil SEBELUM `git add`.
          # Setelah di-add, `git diff --diff-filter=U` selalu 0 dan tidak bisa
          # dipakai sebagai indikator keberhasilan resolver.
          UNMERGED_PATHS="$(git diff --name-only --diff-filter=U)"
          UNMERGED_BEFORE="$(printf '%s\n' "$UNMERGED_PATHS" | grep -c . || true)"
          MARKERS=0
          for f in $UNMERGED_PATHS; do
            if grep -q -E '^(<<<<<<< HEAD|=======|>>>>>>>)' "$f"; then
              MARKERS=$((MARKERS + 1))
            fi
          done

          FINAL=ok
          UNMERGED_AFTER="$UNMERGED_BEFORE"
          if [ "$RESOLVER_RC" -ne 0 ] || [ "$MARKERS" -ne 0 ]; then
            FINAL=failed
          else
            # Resolver sudah menimpa file working tree; stage dulu resolusinya.
            git add -A
            UNMERGED_AFTER="$(git diff --name-only --diff-filter=U | wc -l)"
            CACHED_CHECK="$CONFLICT_DIR/11-diff-check-cached.txt"
            git diff --check --cached 2>&1 | head -n 200 > "$CACHED_CHECK" || true
            git diff --cached --stat 2>/dev/null | tail -n 60 \
              > "$CONFLICT_DIR/12-resolved-stat.txt" || true
            if [ "$UNMERGED_AFTER" -ne 0 ] || grep -q 'leftover conflict marker' "$CACHED_CHECK"; then
              FINAL=failed
            elif [ -s "$CACHED_CHECK" ]; then
              echo "::warning::Ada whitespace warning setelah resolusi; lihat 11-diff-check-cached.txt"
            fi
          fi

          {
            echo "resolver_rc=$RESOLVER_RC"
            echo "unmerged_paths_before_add=$UNMERGED_BEFORE"
            echo "files_with_markers=$MARKERS"
            echo "unmerged_paths_after_add=$UNMERGED_AFTER"
            echo "unmerged_paths=$UNMERGED_AFTER"
            echo "final=$FINAL"
          } > "$CONFLICT_DIR/10-resolve-check.txt" || true

          if [ "$FINAL" = "ok" ]; then
            if [ "$MERGE_MODE" = "merge" ]; then
              git -c core.editor=true merge --continue
            elif [ "$MERGE_MODE" = "rebase" ]; then
              git -c core.editor=true rebase --continue
            else
              git -c core.editor=true cherry-pick --continue || true
              git -c core.editor=true cherry-pick --quit >/dev/null 2>&1 || true
            fi
            [ "$(git diff --name-only --diff-filter=U | wc -l)" -eq 0 ] || FINAL=failed
            if [ "$FINAL" != "ok" ]; then
              echo "final=failed (setelah merge --continue masih ada path unmerged)" \
                >> "$CONFLICT_DIR/10-resolve-check.txt" || true
            fi
          fi

          if [ "$FINAL" = "ok" ]; then
            echo "resolve_status=ok" >> "$GITHUB_OUTPUT"
            echo "### :white_check_mark: Auto-resolve berhasil; merge dilanjutkan dan build diproses" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "resolve_status=failed" >> "$GITHUB_OUTPUT"
            echo "::error::Auto-resolve gagal. resolver_rc=$RESOLVER_RC, unmerged_before=$UNMERGED_BEFORE, unmerged_after_add=$UNMERGED_AFTER, files_with_markers=$MARKERS."
            echo "### :x: Auto-resolve gagal; build dibatalkan" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload conflict diagnostics
        if: always() && steps.apply.outputs.apply_status == 'conflict' && steps.resolve.outputs.resolve_status != 'ok'
        uses: actions/upload-artifact@v4
        with:
          name: cip-conflict-logs
          path: ${{ env.CONFLICT_DIR }}
          retention-days: 7
          compression-level: 9
          if-no-files-found: warn

      - name: Abort when conflicts remain
        if: steps.apply.outputs.apply_status == 'conflict' && steps.resolve.outputs.resolve_status != 'ok'
        run: |
          echo "::error::Konflik belum selesai. Unduh artifact cip-conflict-logs dan selesaikan manual."
          exit 1

      # ------------------------------------------------------------------
      # 4. Setup toolchain + ccache masquerade, lalu build
      # ------------------------------------------------------------------
      - name: Build kernel with ccache
        if: success() && (steps.apply.outputs.apply_status == 'ok' || steps.resolve.outputs.resolve_status == 'ok')
        env:
          SOURCE_SHA: ${{ steps.clone.outputs.source_sha }}
          CIP_TAG: ${{ steps.meta.outputs.cip_tag }}
          CIP_OBJ: ${{ steps.meta.outputs.cip_obj }}
        run: |
          set -euo pipefail

          TOOLBIN=""
          if [ -n "$TOOLCHAIN_REPO" ]; then
            if ! git clone --depth 1 --branch "$TOOLCHAIN_BRANCH" \
                 "$TOOLCHAIN_REPO" "$GITHUB_WORKSPACE/toolchain" 2>/dev/null; then
              git clone --depth 1 "$TOOLCHAIN_REPO" "$GITHUB_WORKSPACE/toolchain"
            fi
            TOOLBIN="$GITHUB_WORKSPACE/toolchain/bin"
          fi

          # ccache masquerade: symlink dengan nama tool persis yang dipanggil kernel
          mkdir -p "$CCACHE_DIR/bin"
          CCACHE_BIN="$(command -v ccache)"
          for prefix in "$CROSS_COMPILE" "$CROSS_COMPILE_ARM32"; do
            [ -n "$prefix" ] || continue
            for suffix in gcc g++ cc c++; do
              ln -sf "$CCACHE_BIN" "$CCACHE_DIR/bin/${prefix}${suffix}"
            done
          done
          if [ "$COMPILER" = "clang" ]; then
            ln -sf "$CCACHE_BIN" "$CCACHE_DIR/bin/clang"
            ln -sf "$CCACHE_BIN" "$CCACHE_DIR/bin/clang++"
          fi
          export PATH="$CCACHE_DIR/bin:$TOOLBIN:$PATH"

          cd "$WORKDIR"
          echo "Compiler : $COMPILER"
          echo "CIP      : $CIP_TAG ($(git rev-parse "$CIP_OBJ" 2>/dev/null || echo n/a))"
          echo "ccache   : $(ccache --version | head -n 1)"

          # Opsi DIAGNOSTIK: kembalikan stack jaringan ke versi source HEAD.
          # Dipakai hanya untuk menguji apakah masalah Wi-Fi/hotspot/data
          # berasal dari perubahan jaringan CIP. Ini menurunkan fix keamanan
          # jaringan CIP, jadi JANGAN dipakai untuk build final.
          if [ "${USE_VENDOR_NETWORK:-false}" = "true" ]; then
            echo "DIAGNOSTIC: restore jaringan dari SOURCE_SHA=$SOURCE_SHA"
            for p in net include/net drivers/net \
                     include/linux/netdevice.h include/linux/skbuff.h \
                     include/linux/ip.h include/linux/ipv6.h \
                     include/linux/tcp.h include/linux/udp.h \
                     drivers/misc/mediatek/connectivity; do
              if git cat-file -e "$SOURCE_SHA:$p" 2>/dev/null; then
                git checkout "$SOURCE_SHA" -- "$p"
                echo "RESTORE_FROM_SOURCE: $p"
              fi
            done
          fi

          make O=out ARCH="$ARCH" "$DEFCONFIG"

          # Pastikan driver Wi-Fi MediaTek tetap built-in setelah merge CIP.
          # Kalau config ini hilang, Wi-Fi/hotspot bisa mati walaupun boot sukses.
          for cfg in CONFIG_CFG80211=y CONFIG_WLAN_DRV_BUILD_IN=y; do
            if ! grep -q "^${cfg}\$" out/.config; then
              echo "::warning::$cfg tidak ada di .config - cek Wi-Fi setelah flash"
            fi
          done

          # Vendor MediaTek lama punya banyak warning di GCC runner (format,
          # misleading-indentation, memset-elt-size, dll). Makefile vendor
          # menambahkan -Werror *setelah* KCFLAGS, jadi -Wno-error umum kalah.
          # -Wno-error=X (spesifik) tetap menang walau -Werror umum datang
          # belakangan, jadi dipakai sebagai pengaman tambahan.
          KCFLAGS="-Wno-error"
          PROBE_CC=gcc
          [ "$COMPILER" = "clang" ] && PROBE_CC=clang
          for w in format format-extra-args format-overflow format-truncation \
                   misleading-indentation memset-elt-size sizeof-pointer-memaccess \
                   unused-variable unused-but-set-variable unused-function \
                   unused-value unused-result declaration-after-statement \
                   sign-compare switch switch-unreachable parentheses \
                   array-parameter array-bounds stringop-overflow stringop-truncation \
                   stringop-overread dangling-pointer pointer-to-int-cast \
                   enum-compare undef int-conversion \
                   maybe-uninitialized uninitialized overflow restrict; do
            # gcc/clang beda daftar warning; lewati yang tidak dikenal supaya
            # flag pengaman ini tidak pernah menggagalkan build itu sendiri.
            if printf 'int main(void){return 0;}\n' | \
                 "$PROBE_CC" "-Wno-error=$w" -x c -c -o /dev/null - 2>/dev/null; then
              KCFLAGS="$KCFLAGS -Wno-error=$w"
            else
              echo "skip unsupported warning: -Wno-error=$w"
            fi
          done
          echo "KCFLAGS: $KCFLAGS"
          if [ "$COMPILER" = "clang" ]; then
            make "-j$JOBS" O=out ARCH="$ARCH" \
              CC=clang LD=ld.lld KCFLAGS="$KCFLAGS" \
              CROSS_COMPILE="$CROSS_COMPILE" \
              CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
              2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          else
            make "-j$JOBS" O=out ARCH="$ARCH" \
              KCFLAGS="$KCFLAGS" \
              CROSS_COMPILE="$CROSS_COMPILE" \
              CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
              2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          fi

          BOOTDIR="out/arch/$ARCH/boot"
          IMAGE=""
          for candidate in Image.gz-dtb Image.gz Image; do
            if [ -f "$BOOTDIR/$candidate" ]; then IMAGE="$candidate"; break; fi
          done
          if [ -z "$IMAGE" ]; then
            echo "::error::Tidak ada Image/Image.gz/Image.gz-dtb yang dihasilkan"
            exit 1
          fi
          echo "$IMAGE" > "$GITHUB_WORKSPACE/image-name.txt"

          {
            echo "Kernel source    : $SOURCE_REPO"
            echo "Source branch    : $SOURCE_BRANCH"
            echo "Source HEAD      : $SOURCE_SHA"
            echo "CIP target       : $CIP_TAG"
            echo "Apply mode       : $MERGE_MODE"
            echo "Defconfig        : $DEFCONFIG"
            echo "Compiler         : $COMPILER"
            echo "-j               : $JOBS"
            echo "Kernel image     : $IMAGE"
            echo "Kernel release   : $(grep -h UTS_RELEASE out/include/generated/utsrelease.h 2>/dev/null | head -n 1 || echo n/a)"
            echo "Merged HEAD      : $(git rev-parse HEAD)"
            echo ""
            echo "--- ccache stats ---"
            ccache -s 2>/dev/null || true
          } > "$GITHUB_WORKSPACE/build-info.txt"

      - name: Upload build log when build fails
        if: failure() && (steps.apply.outputs.apply_status == 'ok' || steps.resolve.outputs.resolve_status == 'ok')
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log
          path: ${{ github.workspace }}/build.log
          retention-days: 7
          if-no-files-found: warn

      # ------------------------------------------------------------------
      # 5. Bungkus AnyKernel3
      # ------------------------------------------------------------------
      - name: Package AnyKernel3 flashable zip
        id: package
        if: success() && (steps.apply.outputs.apply_status == 'ok' || steps.resolve.outputs.resolve_status == 'ok')
        run: |
          set -euo pipefail
          IMAGE="$(cat "$GITHUB_WORKSPACE/image-name.txt")"
          git clone --depth 1 --branch "$AK3_BRANCH" "$AK3_REPO" "$GITHUB_WORKSPACE/anykernel"
          cd "$GITHUB_WORKSPACE/anykernel"

          # Jangan pakai anykernel.sh contoh dari osm0sis: ia masih memuat
          # patch ramdisk maguro (replace_string init.rc, patch_fstab tuna, dst)
          # yang bisa menggagalkan flash di earth. Tulis ulang bersih mengikuti
          # referensi AnyKernel3 yang dipakai device (earth + aether, slot A/B).
          cat > anykernel.sh <<'AK3EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=LineageOS CIP __VERSION__ (__DEVICE__) by GitHub Actions
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=__DEVICE__
          device.name2=aether
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install
          ## boot files attributes
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          } # end attributes

          # boot shell variables
          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install
          dump_boot; # use split_boot to skip ramdisk unpack, e.g. for devices with init_boot ramdisk

          write_boot; # use flash_boot to skip ramdisk repack, e.g. for devices with init_boot ramdisk
          ## end boot install
          AK3EOF
          sed -i "s/__VERSION__/${{ steps.meta.outputs.version }}/g; s/__DEVICE__/$DEVICE/g" anykernel.sh

          cp "$WORKDIR/out/arch/$ARCH/boot/$IMAGE" .
          ZIP="$GITHUB_WORKSPACE/kernel-${DEVICE}-${{ steps.meta.outputs.version }}-$(date +%Y%m%d).zip"
          zip -r9 "$ZIP" * -x .git README.md '*placeholder*'

          echo "zip_path=$ZIP" >> "$GITHUB_OUTPUT"
          echo "### :package: Flashable zip: \`$(basename "$ZIP")\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload flashable zip, patch, and build info
        if: success() && (steps.apply.outputs.apply_status == 'ok' || steps.resolve.outputs.resolve_status == 'ok')
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.device_codename }}-${{ steps.meta.outputs.version }}
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ github.workspace }}/cip-upgrade.patch
            ${{ github.workspace }}/build-info.txt
          retention-days: 14
          compression-level: 9
          if-no-files-found: warn
